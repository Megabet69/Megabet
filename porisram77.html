          { id: 'q2', text: 'Who was the first ever Assamese civil servant to enter the Indian Civil Service (ICS)?', options: [{ id: 'a', text: 'Anundoram Borooah' }, { id: 'b', text: 'Gopinath Bordoloi' }, { id: 'c', text: 'Nabin Chandra Bordoloi' }, { id: 'd', text: 'Tarun Ram Phukan' }], correct: 'a', explanation: 'Anundoram Borooah cleared the ICS examination in 1872.' },
          { id: 'q3', text: 'Constitutional provision for State Public Service Commissions is laid down under which Article?', options: [{ id: 'a', text: 'Article 312' }, { id: 'b', text: 'Article 315' }, { id: 'c', text: 'Article 324' }, { id: 'd', text: 'Article 356' }], correct: 'b', explanation: 'Article 315 provides for Public Service Commissions for the Union and for each of the States.' },
          { id: 'q4', text: 'How many autonomous district councils function under the Sixth Schedule in Assam?', options: [{ id: 'a', text: '2' }, { id: 'b', text: '3' }, { id: 'c', text: '6' }, { id: 'd', text: '10' }], correct: 'b', explanation: 'Assam has 3 Sixth Schedule Autonomous Councils: Bodoland, Karbi Anglong, and Dima Hasao.' },
          { id: 'q5', text: 'Which Article of the Indian Constitution grants special provisions to the State of Assam?', options: [{ id: 'a', text: 'Article 371A' }, { id: 'b', text: 'Article 371B' }, { id: 'c', text: 'Article 371C' }, { id: 'd', text: 'Article 370' }], correct: 'b', explanation: 'Article 371B provides special legislative provisions for the State of Assam.' },
          { id: 'q6', text: 'The Gauhati High Court was established in which year?', options: [{ id: 'a', text: '1947' }, { id: 'b', text: '1948' }, { id: 'c', text: '1950' }, { id: 'd', text: '1952' }], correct: 'b', explanation: 'The Gauhati High Court was established on March 1, 1948.' },
          { id: 'q7', text: 'What is the total strength of the Assam Legislative Assembly (MLAs)?', options: [{ id: 'a', text: '91' }, { id: 'b', text: '126' }, { id: 'c', text: '140' }, { id: 'd', text: '230' }], correct: 'b', explanation: 'The Assam Legislative Assembly consists of 126 elected members.' },
          { id: 'q8', text: 'Who appoints the Chairman and members of the Assam Public Service Commission?', options: [{ id: 'a', text: 'President of India' }, { id: 'b', text: 'Governor of Assam' }, { id: 'c', text: 'Chief Minister of Assam' }, { id: 'd', text: 'Chief Justice of Gauhati High Court' }], correct: 'b', explanation: 'The Governor of Assam appoints the Chairman and members of the APSC.' },
          { id: 'q9', text: 'Which sanctuary in Assam is famous for the Golden Langur?', options: [{ id: 'a', text: 'Kaziranga' }, { id: 'b', text: 'Manas National Park' }, { id: 'c', text: 'Chakrashila Wildlife Sanctuary' }, { id: 'd', text: 'Dibru-Saikhowa' }], correct: 'c', explanation: 'Chakrashila Wildlife Sanctuary is especially renowned for the conservation of the Golden Langur.' },
          { id: 'q10', text: 'The Brahmaputra Board was established by an Act of Parliament in which year?', options: [{ id: 'a', text: '1970' }, { id: 'b', text: '1980' }, { id: 'c', text: '1991' }, { id: 'd', text: '2000' }], correct: 'b', explanation: 'The Brahmaputra Board was constituted in 1980 for planning and managing flood and river erosion.' },
          { id: 'q11', text: 'What is the retirement age of the Chairman and members of a State Public Service Commission?', options: [{ id: 'a', text: '62 years' }, { id: 'b', text: '65 years' }, { id: 'c', text: '60 years' }, { id: 'd', text: '70 years' }], correct: 'a', explanation: 'State PSC members retire at 62 years of age (Union UPSC members retire at 65).' },
          { id: 'q12', text: 'Under which Article can the Parliament create All India Services like IAS and IPS?', options: [{ id: 'a', text: 'Article 312' }, { id: 'b', text: 'Article 315' }, { id: 'c', text: 'Article 320' }, { id: 'd', text: 'Article 323' }], correct: 'a', explanation: 'Article 312 empowers Parliament to create All India Services upon Rajya Sabha resolution.' },
          { id: 'q13', text: 'Who submits the annual report of the APSC performance to the State Government?', options: [{ id: 'a', text: 'The Chairman of APSC to the Governor' }, { id: 'b', text: 'Chief Minister to Assembly' }, { id: 'c', text: 'High Court Chief Justice' }, { id: 'd', text: 'UPSC Chairman' }], correct: 'a', explanation: 'State PSC submits its annual report to the Governor, who places it before the legislature.' },
          { id: 'q14', text: 'Which constitutional amendment introduced Panchayati Raj institutions in India?', options: [{ id: 'a', text: '73rd Amendment Act, 1992' }, { id: 'b', text: '42nd Amendment Act' }, { id: 'c', text: '44th Amendment Act' }, { id: 'd', text: '86th Amendment Act' }], correct: 'a', explanation: 'The 73rd Constitutional Amendment gave constitutional status to Panchayats.' },
          { id: 'q15', text: 'How many Lok Sabha seats does the state of Assam currently have?', options: [{ id: 'a', text: '14' }, { id: 'b', text: '10' }, { id: 'c', text: '7' }, { id: 'd', text: '126' }], correct: 'a', explanation: 'Assam elects 14 members to the Lok Sabha.' },
          { id: 'q16', text: 'How many Rajya Sabha members represent Assam in Parliament?', options: [{ id: 'a', text: '7' }, { id: 'b', text: '9' }, { id: 'c', text: '14' }, { id: 'd', text: '5' }], correct: 'a', explanation: 'Assam has 7 seats in the Rajya Sabha.' },
          { id: 'q17', text: 'Which schedule of the Constitution contains the division of powers (Union, State, Concurrent Lists)?', options: [{ id: 'a', text: 'Seventh Schedule' }, { id: 'b', text: 'Sixth Schedule' }, { id: 'c', text: 'Eighth Schedule' }, { id: 'd', text: 'Ninth Schedule' }], correct: 'a', explanation: 'The Seventh Schedule outlines the legislative lists.' },
          { id: 'q18', text: 'What is the language recognized in the Eighth Schedule spoken by the majority in Assam?', options: [{ id: 'a', text: 'Assamese (Axomiya)' }, { id: 'b', text: 'Bengali' }, { id: 'c', text: 'Bodo' }, { id: 'd', text: 'Karbi' }], correct: 'a', explanation: 'Assamese is the primary scheduled official language of the state.' },
          { id: 'q19', text: 'When was the Bodo Accord signed that created the Bodoland Territorial Council (BTC)?', options: [{ id: 'a', text: '2003' }, { id: 'b', text: '1985' }, { id: 'c', text: '1993' }, { id: 'd', text: '2020' }], correct: 'a', explanation: 'The second Bodo Accord in February 2003 established the BTC under the Sixth Schedule.' },
          { id: 'q20', text: 'Who holds executive power in the State Government of Assam constitutionally?', options: [{ id: 'a', text: 'The Governor (exercised through Council of Ministers headed by Chief Minister)' }, { id: 'b', text: 'Chief Justice' }, { id: 'c', text: 'Speaker' }, { id: 'd', text: 'Chief Secretary' }], correct: 'a', explanation: 'Executive power vests in the Governor, exercised on the aid and advice of the cabinet.' },
          { id: 'q21', text: 'Which wetland in Assam is a Ramsar Wetland Site of international importance?', options: [{ id: 'a', text: 'Deepor Beel' }, { id: 'b', text: 'Sonbeel' }, { id: 'c', text: 'Haor lake' }, { id: 'd', text: 'Chandubi lake' }], correct: 'a', explanation: 'Deepor Beel on the south-west of Guwahati is Assam’s sole Ramsar wetland site.' },
          { id: 'q22', text: 'What is the principal mandate of the Assam State Information Commission?', options: [{ id: 'a', text: 'Enforcing the Right to Information (RTI) Act' }, { id: 'b', text: 'Conducting civil service exams' }, { id: 'c', text: 'Auditing state finances' }, { id: 'd', text: 'Settling land disputes' }], correct: 'a', explanation: 'The Information Commission deals with RTI appeals and complaints.' },
          { id: 'q23', text: 'Which committee or commission recommended linguistic reorganization of states including Assam context?', options: [{ id: 'a', text: 'Fazal Ali Commission (States Reorganisation Commission)' }, { id: 'b', text: 'Sarkaria Commission' }, { id: 'c', text: 'Punchhi Commission' }, { id: 'd', text: 'Verma Committee' }], correct: 'a', explanation: 'The SRC headed by Fazal Ali evaluated state borders in the 1950s.' },
          { id: 'q24', text: 'Under Article 200, a Bill passed by the Assam Legislative Assembly is presented to whom for assent?', options: [{ id: 'a', text: 'The Governor of Assam' }, { id: 'b', text: 'The President of India' }, { id: 'c', text: 'Prime Minister' }, { id: 'd', text: 'Supreme Court' }], correct: 'a', explanation: 'Bills passed by state legislatures require Governor’s assent to become law.' },
          { id: 'q25', text: 'What is the quorum required to constitute a meeting of the Assam Legislative Assembly?', options: [{ id: 'a', text: '10 members or 1/10th of total membership' }, { id: 'b', text: 'Half the members' }, { id: 'c', text: '25 members' }, { id: 'd', text: 'Quorum is not required' }], correct: 'a', explanation: 'Parliamentary quorum rules apply as one-tenth of total members.' },
          { id: 'q26', text: 'Who acts as the Chairman of the North Eastern Council (NEC)?', options: [{ id: 'a', text: 'Union Minister of Development of North Eastern Region (DoNER) or nominated Union Minister' }, { id: 'b', text: 'Prime Minister' }, { id: 'c', text: 'Chief Minister of Assam' }, { id: 'd', text: 'President' }], correct: 'a', explanation: 'Union DoNER Minister serves as Chairman of the NEC.' },
          { id: 'q27', text: 'The concept of Directive Principles of State Policy (DPSP) in the Indian Constitution is borrowed from:', options: [{ id: 'a', text: 'Ireland' }, { id: 'b', text: 'USA' }, { id: 'c', text: 'Britain' }, { id: 'd', text: 'Canada' }], correct: 'a', explanation: 'DPSP is inspired by the Irish Constitution.' },
          { id: 'q28', text: 'Which constitutional body conducts elections to panchayats and urban local bodies in Assam?', options: [{ id: 'a', text: 'Assam State Election Commission' }, { id: 'b', text: 'Election Commission of India' }, { id: 'c', text: 'Delimitation Commission' }, { id: 'd', text: 'APSC' }], correct: 'a', explanation: 'State Election Commission conducts local body elections.' },
          { id: 'q29', text: 'What is the primary function of the Comptroller and Auditor General (CAG) regarding state accounts?', options: [{ id: 'a', text: 'Audit receipts and expenditure of the State Government and report to Governor' }, { id: 'b', text: 'Collect state GST' }, { id: 'c', text: 'Formulate state budget' }, { id: 'd', text: 'Manage treasury' }], correct: 'a', explanation: 'CAG audits public finances and submits reports to the Governor for the legislature.' },
          { id: 'q30', text: 'Which writ is issued by a higher court to secure the release of a person unlawfully detained?', options: [{ id: 'a', text: 'Habeas Corpus' }, { id: 'b', text: 'Mandamus' }, { id: 'c', text: 'Certiorari' }, { id: 'd', text: 'Quo-Warranto' }], correct: 'a', explanation: 'Habeas Corpus protects against illegal detention ("to have the body of").' },
          { id: 'q31', text: 'What is the maximum gap permitted between two sessions of the State Legislature under Article 174?', options: [{ id: 'a', text: 'Six months' }, { id: 'b', text: 'Three months' }, { id: 'c', text: 'One year' }, { id: 'd', text: 'Nine months' }], correct: 'a', explanation: 'Not more than six months shall intervene between two legislative sessions.' },
          { id: 'q32', text: 'Who was the first Chief Justice of the Supreme Court hailing from Northeast India (Assam)?', options: [{ id: 'a', text: 'Justice Ranjan Gogoi' }, { id: 'b', text: 'Justice Parbati Kumar Goswami' }, { id: 'c', text: 'Justice Hrishikesh Roy' }, { id: 'd', text: 'Justice Ujjal Bhuyan' }], correct: 'a', explanation: 'Justice Ranjan Gogoi served as the 46th Chief Justice of India.' },
          { id: 'q33', text: 'Under which Article can the President declare a National Emergency?', options: [{ id: 'a', text: 'Article 352' }, { id: 'b', text: 'Article 356' }, { id: 'c', text: 'Article 360' }, { id: 'd', text: 'Article 370' }], correct: 'a', explanation: 'Article 352 governs National Emergency proclamations.' },
          { id: 'q34', text: 'President’s Rule in a State due to failure of constitutional machinery is imposed under:', options: [{ id: 'a', text: 'Article 356' }, { id: 'b', text: 'Article 352' }, { id: 'c', text: 'Article 365' }, { id: 'd', text: 'Both A and C' }], correct: 'd', explanation: 'Articles 356 and 365 deal with state emergency provisions.' },
          { id: 'q35', text: 'Financial Emergency in India can be declared under which Article?', options: [{ id: 'a', text: 'Article 360' }, { id: 'b', text: 'Article 356' }, { id: 'c', text: 'Article 352' }, { id: 'd', text: 'Article 340' }], correct: 'a', explanation: 'Article 360 covers financial emergency (never invoked so far in India).' },
          { id: 'q36', text: 'Who certifies a Bill as a Money Bill in the State Legislative Assembly?', options: [{ id: 'a', text: 'The Speaker of the Assembly' }, { id: 'b', text: 'The Finance Minister' }, { id: 'c', text: 'The Governor' }, { id: 'd', text: 'The Advocate General' }], correct: 'a', explanation: 'The Speaker’s decision on whether a bill is a Money Bill is final.' },
          { id: 'q37', text: 'What is the role of the Advocate General for the State of Assam?', options: [{ id: 'a', text: 'Highest legal officer advising the State Government' }, { id: 'b', text: 'Chief Judge of High Court' }, { id: 'c', text: 'Head of Police' }, { id: 'd', text: 'Public Prosecutor' }], correct: 'a', explanation: 'Advocate General (Article 165) is the chief legal advisor to the state government.' },
          { id: 'q38', text: 'Which constitutional amendment lowered the voting age from 21 to 18 years in India?', options: [{ id: 'a', text: '61st Amendment Act, 1988' }, { id: 'b', text: '42nd Amendment' }, { id: 'c', text: '44th Amendment' }, { id: 'd', text: '73rd Amendment' }], correct: 'a', explanation: 'The 61st Amendment reduced voting age to 18.' },
          { id: 'q39', text: 'What is the primary function of the Estimates Committee in the legislature?', options: [{ id: 'a', text: 'Examine economies and financial administration in estimates' }, { id: 'b', text: 'Audit private companies' }, { id: 'c', text: 'Draft tax laws' }, { id: 'd', text: 'Review judiciary' }], correct: 'a', explanation: 'Estimates Committee scrutinizes government expenditure and efficiency.' },
          { id: 'q40', text: 'Which part of the Indian Constitution contains the Fundamental Rights?', options: [{ id: 'a', text: 'Part III (Articles 12-35)' }, { id: 'b', text: 'Part IV' }, { id: 'c', text: 'Part II' }, { id: 'd', text: 'Part I' }], correct: 'a', explanation: 'Part III enshrines Fundamental Rights.' },
          { id: 'q41', text: 'Fundamental Duties were added to the Constitution upon the recommendation of:', options: [{ id: 'a', text: 'Swaran Singh Committee' }, { id: 'b', text: 'Sarkaria Commission' }, { id: 'c', text: 'Balwant Rai Mehta Committee' }, { id: 'd', text: 'Verma Committee' }], correct: 'a', explanation: 'Swaran Singh Committee recommended incorporating Fundamental Duties.' },
          { id: 'q42', text: 'What is the minimum age requirement to contest election for the Lok Sabha or State Legislative Assembly?', options: [{ id: 'a', text: '25 years' }, { id: 'b', text: '30 years' }, { id: 'c', text: '21 years' }, { id: 'd', text: '35 years' }], correct: 'a', explanation: 'Candidate age must be at least 25 years for Lok Sabha / Legislative Assembly.' },
          { id: 'q43', text: 'What is the minimum age requirement for election to the Rajya Sabha or State Legislative Council?', options: [{ id: 'a', text: '30 years' }, { id: 'b', text: '25 years' }, { id: 'c', text: '35 years' }, { id: 'd', text: '21 years' }], correct: 'a', explanation: 'Rajya Sabha / Legislative Council candidate age requirement is 30 years.' },
          { id: 'q44', text: 'Who administers the oath of office to the Governor of a State?', options: [{ id: 'a', text: 'Chief Justice of the High Court of that State (or senior-most judge)' }, { id: 'b', text: 'The President of India' }, { id: 'c', text: 'Prime Minister' }, { id: 'd', text: 'Speaker' }], correct: 'a', explanation: 'High Court Chief Justice administers the oath to the State Governor.' },
          { id: 'q45', text: 'Under Article 368, constitutional amendments require what minimum majority in Parliament?', options: [{ id: 'a', text: 'Special majority (2/3rd present and voting plus absolute majority)' }, { id: 'b', text: 'Simple majority' }, { id: 'c', text: 'Unanimous vote' }, { id: 'd', text: 'Presidential decree' }], correct: 'a', explanation: 'Article 368 outlines special majority requirements for amending the constitution.' },
          { id: 'q46', text: 'The concept of Judicial Review in the Indian Constitution is adopted from:', options: [{ id: 'a', text: 'United States Constitution' }, { id: 'b', text: 'British Constitution' }, { id: 'c', text: 'Australian Constitution' }, { id: 'd', text: 'Soviet Constitution' }], correct: 'a', explanation: 'Judicial review is inspired by the US constitutional framework.' },
          { id: 'q47', text: 'Which constitutional amendment is often described as a "Mini-Constitution"?', options: [{ id: 'a', text: '42nd Amendment Act, 1976' }, { id: 'b', text: '44th Amendment Act' }, { id: 'c', text: '86th Amendment Act' }, { id: 'd', text: '100th Amendment Act' }], correct: 'a', explanation: 'The 42nd Amendment introduced sweeping changes, earning it the title Mini-Constitution.' },
          { id: 'q48', text: 'What does the 100th Constitutional Amendment Act (2015) relate to regarding Assam/India?', options: [{ id: 'a', text: 'India-Bangladesh Land Boundary Agreement (LBA)' }, { id: 'b', text: 'GST introduction' }, { id: 'c', text: 'EWS reservation' }, { id: 'd', text: 'Bodo territorial adjustments' }], correct: 'a', explanation: 'The 100th Amendment facilitated the exchange of enclaves between India and Bangladesh.' },
          { id: 'q49', text: 'Who is the custodian of the Constitution of India?', options: [{ id: 'a', text: 'Supreme Court of India' }, { id: 'b', text: 'The Parliament' }, { id: 'c', text: 'The President' }, { id: 'd', text: 'The Prime Minister' }], correct: 'a', explanation: 'The Supreme Court acts as the final interpreter and guardian of the Constitution.' },
          { id: 'q50', text: 'What is the primary function of the Public Accounts Committee (PAC) in Parliament?', options: [{ id: 'a', text: 'Audit appropriation accounts and CAG reports on public spending' }, { id: 'b', text: 'Draft civil laws' }, { id: 'c', text: 'Appoint ministers' }, { id: 'd', text: 'Manage foreign policy' }], correct: 'a', explanation: 'PAC examines CAG audit reports to ensure financial accountability.' },
          { id: 'q51', text: 'Who estimates the National Income in India?', options: [{ id: 'a', text: 'National Statistical Office (NSO)' }, { id: 'b', text: 'Reserve Bank of India' }, { id: 'c', text: 'Ministry of Finance' }, { id: 'd', text: 'NITI Aayog' }], correct: 'a', explanation: 'The NSO (formerly CSO) under the Ministry of Statistics is responsible for estimating GDP.' },
          { id: 'q52', text: 'The concept of "Five Year Plans" in India was borrowed from which country?', options: [{ id: 'a', text: 'USSR (Russia)' }, { id: 'b', text: 'USA' }, { id: 'c', text: 'UK' }, { id: 'd', text: 'France' }], correct: 'a', explanation: 'The model of centralized economic planning via 5-year plans was inspired by the Soviet Union.' },
          { id: 'q53', text: 'NITI Aayog was established on which date, replacing the Planning Commission?', options: [{ id: 'a', text: '1 January 2015' }, { id: 'b', text: '15 August 2014' }, { id: 'c', text: '26 January 2015' }, { id: 'd', text: '1 April 2016' }], correct: 'a', explanation: 'NITI Aayog acts as the premier policy think tank of the Govt of India, formed in Jan 2015.' },
          { id: 'q54', text: 'GST (Goods and Services Tax) was introduced in India by which Constitutional Amendment Act?', options: [{ id: 'a', text: '101st Amendment Act' }, { id: 'b', text: '100th Amendment Act' }, { id: 'c', text: '102nd Amendment Act' }, { id: 'd', text: '99th Amendment Act' }], correct: 'a', explanation: 'The 101st Constitution Amendment Act, 2016 introduced the comprehensive GST regime.' },
          { id: 'q55', text: 'Which is the longest peninsular river in India?', options: [{ id: 'a', text: 'Godavari' }, { id: 'b', text: 'Krishna' }, { id: 'c', text: 'Kaveri' }, { id: 'd', text: 'Mahanadi' }], correct: 'a', explanation: 'The Godavari, also known as the Dakshin Ganga, is the largest river in peninsular India.' },
          { id: 'q56', text: 'What is the highest peak of the Western Ghats?', options: [{ id: 'a', text: 'Anamudi' }, { id: 'b', text: 'Doddabetta' }, { id: 'c', text: 'Kalsubai' }, { id: 'd', text: 'Mahabaleshwar' }], correct: 'a', explanation: 'Anamudi (2695m) located in Kerala is the highest peak in the Western Ghats and South India.' },
          { id: 'q57', text: 'The Montreal Protocol is an international treaty designed to protect:', options: [{ id: 'a', text: 'The Ozone Layer' }, { id: 'b', text: 'Global biodiversity' }, { id: 'c', text: 'Wetlands' }, { id: 'd', text: 'Coral Reefs' }], correct: 'a', explanation: 'Adopted in 1987, it phases out the production of numerous substances that deplete ozone.' },
          { id: 'q58', text: 'Which was the first National Park established in India?', options: [{ id: 'a', text: 'Jim Corbett National Park' }, { id: 'b', text: 'Kaziranga National Park' }, { id: 'c', text: 'Kanha National Park' }, { id: 'd', text: 'Gir National Park' }], correct: 'a', explanation: 'Established in 1936 as Hailey National Park, it was later renamed Jim Corbett NP.' },
          { id: 'q59', text: 'The Wildlife Protection Act was enacted in India in which year?', options: [{ id: 'a', text: '1972' }, { id: 'b', text: '1980' }, { id: 'c', text: '1986' }, { id: 'd', text: '1992' }], correct: 'a', explanation: 'The WLPA 1972 provides the legal framework for the protection of flora and fauna in India.' },
          { id: 'q60', text: 'Right to Property ceased to be a Fundamental Right and became a Legal Right under which amendment?', options: [{ id: 'a', text: '44th Amendment' }, { id: 'b', text: '42nd Amendment' }, { id: 'c', text: '86th Amendment' }, { id: 'd', text: '73rd Amendment' }], correct: 'a', explanation: 'The 44th Amendment (1978) moved it from Article 31 to Article 300A as a legal right.' },
          { id: 'q61', text: 'Who is known as the "Father of Local Self Government" in India?', options: [{ id: 'a', text: 'Lord Ripon' }, { id: 'b', text: 'Lord Cornwallis' }, { id: 'c', text: 'Lord Macaulay' }, { id: 'd', text: 'Lord Dalhousie' }], correct: 'a', explanation: 'Lord Ripon’s resolution of 1882 is considered the Magna Carta of local self-governance.' },
          { id: 'q62', text: 'The boundary line between India and China is known as:', options: [{ id: 'a', text: 'McMahon Line' }, { id: 'b', text: 'Radcliffe Line' }, { id: 'c', text: 'Durand Line' }, { id: 'd', text: 'Line of Control' }], correct: 'a', explanation: 'The McMahon Line was demarcated in 1914 between Tibet and British India.' },
          { id: 'q63', text: 'Which soil type is most prevalent in the Deccan Plateau and ideal for cotton cultivation?', options: [{ id: 'a', text: 'Black Soil (Regur)' }, { id: 'b', text: 'Alluvial Soil' }, { id: 'c', text: 'Red Soil' }, { id: 'd', text: 'Laterite Soil' }], correct: 'a', explanation: 'Black soil is highly retentive of moisture, making it ideal for growing cotton.' },
          { id: 'q64', text: 'What is the full form of ASEAN?', options: [{ id: 'a', text: 'Association of Southeast Asian Nations' }, { id: 'b', text: 'Alliance of South East Asian Nations' }, { id: 'c', text: 'Assembly of Southeast Asian Nations' }, { id: 'd', text: 'Association of Southern Economic Nations' }], correct: 'a', explanation: 'ASEAN is a regional intergovernmental organization promoting economic/political cooperation.' },
          { id: 'q65', text: 'Sardar Sarovar Dam is built across which river?', options: [{ id: 'a', text: 'Narmada' }, { id: 'b', text: 'Tapti' }, { id: 'c', text: 'Mahanadi' }, { id: 'd', text: 'Godavari' }], correct: 'a', explanation: 'The dam is located on the Narmada river in Gujarat.' },
          { id: 'q66', text: 'Who is the ex-officio Chairman of the Rajya Sabha?', options: [{ id: 'a', text: 'The Vice-President of India' }, { id: 'b', text: 'The President' }, { id: 'c', text: 'The Chief Justice of India' }, { id: 'd', text: 'The Prime Minister' }], correct: 'a', explanation: 'Article 64 states the VP is the ex-officio Chairman of the Council of States.' },
          { id: 'q67', text: 'Which state has the longest coastline in India?', options: [{ id: 'a', text: 'Gujarat' }, { id: 'b', text: 'Andhra Pradesh' }, { id: 'c', text: 'Tamil Nadu' }, { id: 'd', text: 'Maharashtra' }], correct: 'a', explanation: 'Gujarat has the longest coastline among Indian states, spanning over 1,600 km.' },
          { id: 'q68', text: 'In the Indian Constitution, the Concurrent List is adopted from the Constitution of:', options: [{ id: 'a', text: 'Australia' }, { id: 'b', text: 'Canada' }, { id: 'c', text: 'USA' }, { id: 'd', text: 'Ireland' }], correct: 'a', explanation: 'The concept of a Concurrent List (where both center and states can legislate) comes from Australia.' },
          { id: 'q69', text: 'The "Tropic of Cancer" does NOT pass through which of the following states?', options: [{ id: 'a', text: 'Odisha' }, { id: 'b', text: 'Gujarat' }, { id: 'c', text: 'Madhya Pradesh' }, { id: 'd', text: 'Jharkhand' }], correct: 'a', explanation: 'It passes through 8 states: Gujarat, Raj, MP, Chhattisgarh, Jharkhand, WB, Tripura, Mizoram. Not Odisha.' },
          { id: 'q70', text: 'The Ramsar Convention is associated with the conservation of:', options: [{ id: 'a', text: 'Wetlands' }, { id: 'b', text: 'Tigers' }, { id: 'c', text: 'Ozone Layer' }, { id: 'd', text: 'Greenhouse Gases' }], correct: 'a', explanation: 'Signed in 1971 in Ramsar, Iran, it is a treaty for the conservation of wetlands.' },
          { id: 'q71', text: 'Which is the largest fresh water lake in North East India?', options: [{ id: 'a', text: 'Loktak Lake' }, { id: 'b', text: 'Deepor Beel' }, { id: 'c', text: 'Son Beel' }, { id: 'd', text: 'Umiam Lake' }], correct: 'a', explanation: 'Loktak Lake in Manipur is the largest freshwater lake in the region, famous for phumdis.' },
          { id: 'q72', text: 'What is "Repo Rate"?', options: [{ id: 'a', text: 'The rate at which the RBI lends money to commercial banks' }, { id: 'b', text: 'The rate at which banks lend to public' }, { id: 'c', text: 'The rate at which RBI borrows from banks' }, { id: 'd', text: 'Tax rate on corporate profits' }], correct: 'a', explanation: 'Repurchase Option (Repo) rate is the central bank’s lending rate to inject liquidity.' },
          { id: 'q73', text: 'The concept of "Sustainable Development" was popularized by which report?', options: [{ id: 'a', text: 'Brundtland Report (Our Common Future)' }, { id: 'b', text: 'Kyoto Protocol' }, { id: 'c', text: 'Agenda 21' }, { id: 'd', text: 'Rio Declaration' }], correct: 'a', explanation: 'The 1987 Brundtland Report defined sustainable development.' },
          { id: 'q74', text: 'Which Article of the Constitution abolishes Untouchability?', options: [{ id: 'a', text: 'Article 17' }, { id: 'b', text: 'Article 14' }, { id: 'c', text: 'Article 19' }, { id: 'd', text: 'Article 21' }], correct: 'a', explanation: 'Article 17 abolishes untouchability and forbids its practice in any form.' },
          { id: 'q75', text: 'What does "Green Revolution" refer to in Indian economic history?', options: [{ id: 'a', text: 'Massive increase in agricultural production via HYV seeds and modern methods' }, { id: 'b', text: 'Forest conservation movement' }, { id: 'c', text: 'Dairy production increase' }, { id: 'd', text: 'Renewable energy adoption' }], correct: 'a', explanation: 'Spearheaded by M.S. Swaminathan in the 1960s, it transformed Indian agriculture.' },
          { id: 'q76', text: 'Which of the following is NOT a direct tax?', options: [{ id: 'a', text: 'Goods and Services Tax (GST)' }, { id: 'b', text: 'Income Tax' }, { id: 'c', text: 'Corporate Tax' }, { id: 'd', text: 'Wealth Tax' }], correct: 'a', explanation: 'GST is an indirect consumption tax.' },
          { id: 'q77', text: 'Where is the headquarters of the World Trade Organization (WTO)?', options: [{ id: 'a', text: 'Geneva, Switzerland' }, { id: 'b', text: 'New York, USA' }, { id: 'c', text: 'Paris, France' }, { id: 'd', text: 'Washington D.C., USA' }], correct: 'a', explanation: 'WTO regulates international trade and is based in Geneva.' },
          { id: 'q78', text: 'What causes the El Niño phenomenon?', options: [{ id: 'a', text: 'Abnormal warming of surface ocean waters in the eastern tropical Pacific' }, { id: 'b', text: 'Cooling of the Atlantic ocean' }, { id: 'c', text: 'Melting of Arctic ice' }, { id: 'd', text: 'Monsoon failure in the Indian Ocean' }], correct: 'a', explanation: 'El Niño is the warm phase of the ENSO cycle affecting global weather patterns.' },
          { id: 'q79', text: 'Who was the Chairman of the Drafting Committee of the Indian Constitution?', options: [{ id: 'a', text: 'Dr. B.R. Ambedkar' }, { id: 'b', text: 'Dr. Rajendra Prasad' }, { id: 'c', text: 'Jawaharlal Nehru' }, { id: 'd', text: 'Sardar Vallabhbhai Patel' }], correct: 'a', explanation: 'Dr. Ambedkar chaired the committee that drafted the text of the Constitution.' },
          { id: 'q80', text: 'Which is the largest archipelago in the world?', options: [{ id: 'a', text: 'Indonesia' }, { id: 'b', text: 'Japan' }, { id: 'c', text: 'Philippines' }, { id: 'd', text: 'Maldives' }], correct: 'a', explanation: 'Indonesia comprises over 17,000 islands, making it the largest archipelago.' },
          { id: 'q81', text: 'What does "FDI" stand for in economics?', options: [{ id: 'a', text: 'Foreign Direct Investment' }, { id: 'b', text: 'Federal Deposit Insurance' }, { id: 'c', text: 'Financial Development Index' }, { id: 'd', text: 'Foreign Development Initiative' }], correct: 'a', explanation: 'FDI is an investment in the form of a controlling ownership in a business in one country by an entity based in another.' },
          { id: 'q82', text: 'Which layer of the atmosphere contains the ozone layer?', options: [{ id: 'a', text: 'Stratosphere' }, { id: 'b', text: 'Troposphere' }, { id: 'c', text: 'Mesosphere' }, { id: 'd', text: 'Thermosphere' }], correct: 'a', explanation: 'The ozone layer sits in the lower portion of the stratosphere.' },
          { id: 'q83', text: 'In which year did the Reserve Bank of India (RBI) commence operations?', options: [{ id: 'a', text: '1935' }, { id: 'b', text: '1947' }, { id: 'c', text: '1950' }, { id: 'd', text: '1921' }], correct: 'a', explanation: 'RBI was established on April 1, 1935, in accordance with the RBI Act 1934.' },
          { id: 'q84', text: 'What is the full form of BRICS?', options: [{ id: 'a', text: 'Brazil, Russia, India, China, South Africa' }, { id: 'b', text: 'Britain, Russia, India, China, South Africa' }, { id: 'c', text: 'Brazil, Romania, India, China, South Korea' }, { id: 'd', text: 'Bangladesh, Russia, India, China, Spain' }], correct: 'a', explanation: 'BRICS is an intergovernmental organization comprising five major emerging economies.' },
          { id: 'q85', text: 'Which ocean is the deepest in the world?', options: [{ id: 'a', text: 'Pacific Ocean' }, { id: 'b', text: 'Atlantic Ocean' }, { id: 'c', text: 'Indian Ocean' }, { id: 'd', text: 'Arctic Ocean' }], correct: 'a', explanation: 'The Pacific Ocean holds the Mariana Trench, the deepest point on Earth.' },
          { id: 'q86', text: 'What is a "Deficit Budget"?', options: [{ id: 'a', text: 'When government expenditure exceeds government revenue' }, { id: 'b', text: 'When revenue exceeds expenditure' }, { id: 'c', text: 'When exports exceed imports' }, { id: 'd', text: 'When inflation is high' }], correct: 'a', explanation: 'A fiscal deficit occurs when a government spends more money than it takes in from taxes.' },
          { id: 'q87', text: 'The "PURA" (Provision of Urban Amenities to Rural Areas) model was advocated by:', options: [{ id: 'a', text: 'A.P.J. Abdul Kalam' }, { id: 'b', text: 'Manmohan Singh' }, { id: 'c', text: 'Amartya Sen' }, { id: 'd', text: 'M.S. Swaminathan' }], correct: 'a', explanation: 'Former President Dr. Kalam proposed PURA to bridge the rural-urban divide.' },
          { id: 'q88', text: 'Which article ensures the Right to Education?', options: [{ id: 'a', text: 'Article 21A' }, { id: 'b', text: 'Article 21' }, { id: 'c', text: 'Article 19' }, { id: 'd', text: 'Article 45' }], correct: 'a', explanation: 'Article 21A (added by 86th Amendment) makes education a fundamental right for children 6-14.' },
          { id: 'q89', text: 'The Kyoto Protocol is an international agreement linked to:', options: [{ id: 'a', text: 'Reducing greenhouse gas emissions' }, { id: 'b', text: 'Nuclear disarmament' }, { id: 'c', text: 'Protecting endangered species' }, { id: 'd', text: 'Maritime trade' }], correct: 'a', explanation: 'Adopted in 1997, it operationalizes the UN Framework Convention on Climate Change.' },
          { id: 'q90', text: 'What is "Fiscal Policy"?', options: [{ id: 'a', text: 'Government policy regarding taxation and public spending' }, { id: 'b', text: 'RBI\'s policy on interest rates' }, { id: 'c', text: 'Trade policy for exports' }, { id: 'd', text: 'Corporate dividend rules' }], correct: 'a', explanation: 'Fiscal policy is managed by the executive/finance ministry via budgets, unlike monetary policy by RBI.' },
          { id: 'q91', text: 'What instrument is used to measure atmospheric pressure?', options: [{ id: 'a', text: 'Barometer' }, { id: 'b', text: 'Hygrometer' }, { id: 'c', text: 'Anemometer' }, { id: 'd', text: 'Thermometer' }], correct: 'a', explanation: 'A barometer is a scientific instrument used to measure air pressure.' },
          { id: 'q92', text: 'Which is the longest national highway in India?', options: [{ id: 'a', text: 'NH 44 (formerly NH 7)' }, { id: 'b', text: 'NH 27' }, { id: 'c', text: 'NH 1' }, { id: 'd', text: 'NH 10' }], correct: 'a', explanation: 'NH 44 runs from Srinagar to Kanyakumari, covering over 3,700 km.' },
          { id: 'q93', text: 'Where is the headquarters of SAARC located?', options: [{ id: 'a', text: 'Jakarta, Indonesia' }, { id: 'b', text: 'Kathmandu, Nepal' }, { id: 'c', text: 'New Delhi, India' }, { id: 'd', text: 'Colombo, Sri Lanka' }], correct: 'b', explanation: 'The SAARC Secretariat is based in Kathmandu, Nepal.' },
          { id: 'q94', text: 'What does "SEBI" stand for?', options: [{ id: 'a', text: 'Securities and Exchange Board of India' }, { id: 'b', text: 'Stock Exchange Bureau of India' }, { id: 'c', text: 'State Economic Board of India' }, { id: 'd', text: 'Securities Evaluation Board of India' }], correct: 'a', explanation: 'SEBI is the regulatory body for securities and commodity markets in India.' },
          { id: 'q95', text: 'Brahmaputra enters India under what name in Arunachal Pradesh?', options: [{ id: 'a', text: 'Siang or Dihang' }, { id: 'b', text: 'Lohit' }, { id: 'c', text: 'Tsangpo' }, { id: 'd', text: 'Subansiri' }], correct: 'a', explanation: 'The river is called Tsangpo in Tibet and Siang/Dihang when it enters Arunachal Pradesh.' },
          { id: 'q96', text: 'Who discovered the phenomenon of radioactivity?', options: [{ id: 'a', text: 'Henri Becquerel' }, { id: 'b', text: 'Marie Curie' }, { id: 'c', text: 'Albert Einstein' }, { id: 'd', text: 'Ernest Rutherford' }], correct: 'a', explanation: 'Henri Becquerel discovered radioactivity in 1896 (later extensively studied by the Curies).' },
          { id: 'q97', text: 'What is the full form of NITI in NITI Aayog?', options: [{ id: 'a', text: 'National Institution for Transforming India' }, { id: 'b', text: 'National Initiative for Technological India' }, { id: 'c', text: 'New India Transformation Institute' }, { id: 'd', text: 'National Institute for Trade and Industry' }], correct: 'a', explanation: 'NITI stands for National Institution for Transforming India.' },
          { id: 'q98', text: 'Who won the Nobel Prize in Physics for the discovery of the photoelectric effect?', options: [{ id: 'a', text: 'Albert Einstein' }, { id: 'b', text: 'Niels Bohr' }, { id: 'c', text: 'Max Planck' }, { id: 'd', text: 'J.J. Thomson' }], correct: 'a', explanation: 'Einstein was awarded the 1921 Nobel Prize for his discovery of the law of the photoelectric effect.' },
          { id: 'q99', text: 'Which Indian state is the largest producer of Tea?', options: [{ id: 'a', text: 'Assam' }, { id: 'b', text: 'West Bengal' }, { id: 'c', text: 'Kerala' }, { id: 'd', text: 'Tamil Nadu' }], correct: 'a', explanation: 'Assam accounts for over 50% of India’s total tea production.' },
          { id: 'q100', text: 'What is the SI unit of electric current?', options: [{ id: 'a', text: 'Ampere' }, { id: 'b', text: 'Volt' }, { id: 'c', text: 'Ohm' }, { id: 'd', text: 'Watt' }], correct: 'a', explanation: 'The Ampere (A) is the base unit of electric current in the International System of Units.' }
        ]
      },
      history: {
        id: 'history',
        title: 'Assam & Indian History',
        icon: 'landmark',
        color: 'amber',
        questions: [
          { id: 'q1', text: 'The Treaty of Yandaboo was signed on February 24 of which year?', options: [{ id: 'a', text: '1824' }, { id: 'b', text: '1826' }, { id: 'c', text: '1857' }, { id: 'd', text: '1882' }], correct: 'b', explanation: 'The Treaty of Yandaboo ended the First Anglo-Burmese War in 1826, initiating British paramountcy in Assam.' },
          { id: 'q2', text: 'Chaolung Sukaphaa founded the Ahom kingdom in Assam in which year?', options: [{ id: 'a', text: '1205' }, { id: 'b', text: '1228' }, { id: 'c', text: '1253' }, { id: 'd', text: '1300' }], correct: 'b', explanation: 'Sukaphaa crossed the Patkai hills and established Charaideo as the first Ahom capital in 1228.' },
          { id: 'q3', text: 'The legendary naval Battle of Saraighat was fought in:', options: [{ id: 'a', text: '1615' }, { id: 'b', text: '1671' }, { id: 'c', text: '1705' }, { id: 'd', text: '1732' }], correct: 'b', explanation: 'The Battle of Saraighat in 1671 thwarted the Mughal expansion led by Ramsingh into Assam under Lachit Borphukan.' },
          { id: 'q4', text: 'Who led the 1857 anti-British revolt in Assam and was subsequently hanged?', options: [{ id: 'a', text: 'Kushal Konwar' }, { id: 'b', text: 'Maniram Dewan' }, { id: 'c', text: 'Piyali Phukan' }, { id: 'd', text: 'Gomdhar Konwar' }], correct: 'b', explanation: 'Maniram Dewan and Dutiram Barua were executed by the British for conspiring with rebels during the 1857 uprising.' },
          { id: 'q5', text: 'Rang Ghar, Asia’s oldest surviving amphitheater, was built during the reign of:', options: [{ id: 'a', text: 'Rudra Singha' }, { id: 'b', text: 'Pramatta Singha' }, { id: 'c', text: 'Suhungmung' }, { id: 'd', text: 'Gadapani' }], correct: 'b', explanation: 'The permanent brick structure of Rang Ghar was constructed by Ahom King Pramatta Singha in 1746.' },
          { id: 'q6', text: 'Who is acknowledged as the father of Assamese prose?', options: [{ id: 'a', text: 'Srimanta Sankardev' }, { id: 'b', text: 'Bhattadeva' }, { id: 'c', text: 'Hemchandra Barua' }, { id: 'd', text: 'Madhav Kandali' }], correct: 'b', explanation: 'Bhattadeva (Baikunthanatha Bhagavata Bhattacharya) authored Katha-Gita and Katha-Bhagavata in early Assamese prose.' },
          { id: 'q7', text: 'The historic peasant uprising at Patharughat occurred in:', options: [{ id: 'a', text: '1861' }, { id: 'b', text: '1894' }, { id: 'c', text: '1905' }, { id: 'd', text: '1921' }], correct: 'b', explanation: 'Patharughatar Ran took place in January 1894 in Darrang district against unjust British land revenue policies.' },
          { id: 'q8', text: 'Who was the sole martyr from Assam hanged during the Quit India Movement of 1942?', options: [{ id: 'a', text: 'Kushal Konwar' }, { id: 'b', text: 'Bhogeshwari Phukanani' }, { id: 'c', text: 'Kanaklata Barua' }, { id: 'd', text: 'Mukunda Kakati' }], correct: 'a', explanation: 'Kushal Konwar was falsely accused of derailing a military train and hanged in 1943.' },
          { id: 'q9', text: 'The Kamakhya Temple on Nilachal Hill was reconstructed in 1565 AD by:', options: [{ id: 'a', text: 'King Naranarayan of Koch dynasty' }, { id: 'b', text: 'King Sukapha' }, { id: 'c', text: 'King Rudra Singha' }, { id: 'd', text: 'King Brahmapala' }], correct: 'a', explanation: 'Koch King Naranarayan and his brother Chilarai rebuilt the current sanctum of Kamakhya Temple.' },
          { id: 'q10', text: 'The ancient kingdom of Pragiyotishpura is mentioned in which epic literature?', options: [{ id: 'a', text: 'Mahabharata and Ramayana' }, { id: 'b', text: 'Arthashastra only' }, { id: 'c', text: 'Rajatarangini' }, { id: 'd', text: 'Indica' }], correct: 'a', explanation: 'Pragiyotishpura (ancient Assam/Kamarupa) is frequently cited in both the Mahabharata and Ramayana epics.' },
          { id: 'q11', text: 'Who was the founder of the Varman dynasty in ancient Kamarupa?', options: [{ id: 'a', text: 'Pushyavarman' }, { id: 'b', text: 'Bhaskaravarman' }, { id: 'c', text: 'Brahmapala' }, { id: 'd', text: 'Salastambha' }], correct: 'a', explanation: 'Pushyavarman established the Varman dynasty in the 4th century AD.' },
          { id: 'q12', text: 'During whose reign did the famous Chinese pilgrim Hiuen Tsang (Xuanzang) visit Kamarupa?', options: [{ id: 'a', text: 'Bhaskaravarman' }, { id: 'b', text: 'Pushyavarman' }, { id: 'c', text: 'Kumar Bhaskaravarman' }, { id: 'd', text: 'Both A and C' }], correct: 'd', explanation: 'Hiuen Tsang visited Kamarupa in the 7th century during the reign of King Bhaskaravarman.' },
          { id: 'q13', text: 'Who was the first Ahom king to accept Ahom/Hindu religious practices and adopt a Hindu name (Suhungmung)?', options: [{ id: 'a', text: 'Suhungmung' }, { id: 'b', text: 'Sukaphaa' }, { id: 'c', text: 'Pratap Singha' }, { id: 'd', text: 'Rudra Singha' }], correct: 'a', explanation: 'Suhungmung took the Hindu title Swarganarayan, bridging Ahom and indigenous traditions.' },
          { id: 'q14', text: 'The Paik system under the Ahom administration was a system of:', options: [{ id: 'a', text: 'Universal obligatory military and public service by able-bodied subjects' }, { id: 'b', text: 'Tax collection through landlords' }, { id: 'c', text: 'Monastic religious taxation' }, { id: 'd', text: 'Foreign trade monopoly' }], correct: 'a', explanation: 'The Paik system formed the backbone of the Ahom military and state infrastructure.' },
          { id: 'q15', text: 'Who led the heroic martyrdom of teenage freedom fighter Kanaklata Barua in 1942?', options: [{ id: 'a', text: 'She herself led the unarmed procession at Gohpur police station' }, { id: 'b', text: 'Kushal Konwar' }, { id: 'c', text: 'Tarun Ram Phukan' }, { id: 'd', text: 'Gopinath Bordoloi' }], correct: 'a', explanation: 'Kanaklata Barua led the procession holding the national flag and was shot dead by police in Gohpur.' },
          { id: 'q16', text: 'The Battle of Itakhuli was fought in which year between the Ahoms and Mughals?', options: [{ id: 'a', text: '1682' }, { id: 'b', text: '1671' }, { id: 'c', text: '1615' }, { id: 'd', text: '1701' }], correct: 'a', explanation: 'The decisive Battle of Itakhuli in 1682 under Lachit’s successors expelled Mughals west of the Manas river permanently.' },
          { id: 'q17', text: 'Who founded the Satra institution of Ekasarana Dharma in Assam?', options: [{ id: 'a', text: 'Srimanta Sankardev and Madhavdev' }, { id: 'b', text: 'Chilarai' }, { id: 'c', text: 'Bhattadeva' }, { id: 'd', text: 'Damodardev' }], correct: 'a', explanation: 'Sankardev established Satras as spiritual, cultural, and educational centers.' },
          { id: 'q18', text: 'Which Ahom king created the post of "Borphukan" to govern lower Assam west of Kaliabor?', options: [{ id: 'a', text: 'Pratap Singha' }, { id: 'b', text: 'Rudra Singha' }, { id: 'c', text: 'Suhungmung' }, { id: 'd', text: 'Gadapani' }], correct: 'a', explanation: 'King Pratap Singha created the administrative posts of Borphukan and Barbarua.' },
          { id: 'q19', text: 'Who was the first martyr of the Assam Movement (1979–1985)?', options: [{ id: 'a', text: 'Khargeswar Talukdar' }, { id: 'b', text: 'Pushpalata Das' }, { id: 'c', text: 'Maniram Dewan' }, { id: 'd', text: 'Piyali Phukan' }], correct: 'a', explanation: 'Khargeswar Talukdar is regarded as the first martyr of the historic Assam Agitation.' },
          { id: 'q20', text: 'The ancient ruins of Dawaparbatia near Tezpur are famous for what archaeological remains?', options: [{ id: 'a', text: 'Exquisite Gupta-style carved stone door frame' }, { id: 'b', text: 'Bronze statues of Buddha' }, { id: 'c', text: 'Monolithic pillars' }, { id: 'd', text: 'Mughal canons' }], correct: 'a', explanation: 'Da Parbatia features fine terracotta and stone carvings dating to the late Gupta period.' },
          { id: 'q21', text: 'Who authored the famous historical chronicle "Tungkhungia Buranji"?', options: [{ id: 'a', text: 'S.K. Bhuyan' }, { id: 'b', text: 'Hemchandra Barua' }, { id: 'c', text: 'Surjya Kumar Bhuyan' }, { id: 'd', text: 'Both A and C' }], correct: 'd', explanation: 'Dr. S.K. Bhuyan edited and published the Tungkhungia Buranji.' },
          { id: 'q22', text: 'Where was the capital of the Chutia Kingdom located before its annexation by the Ahoms?', options: [{ id: 'a', text: 'Sadiya (Ratnapur / Kundil)' }, { id: 'b', text: 'Garhgaon' }, { id: 'c', text: 'Rangpur' }, { id: 'd', text: 'Jorhat' }], correct: 'a', explanation: 'The Chutia kingdom was centered around Sadiya and Kundil Valley.' },
          { id: 'q23', text: 'Who was the last ruling monarch of the Ahom Kingdom?', options: [{ id: 'a', text: 'Purandeswar Singha' }, { id: 'b', text: 'Chandrakanta Singha' }, { id: 'c', text: 'Kameswar Singha' }, { id: 'd', text: 'Jogeswar Singha' }], correct: 'a', explanation: 'Purandeswar Singha was the last titular king during early British annexation.' },
          { id: 'q24', text: 'The ancient temple of Madan Kamdev is located in which district of Assam?', options: [{ id: 'a', text: 'Kamrup (Baihata Chariali)' }, { id: 'b', text: 'Nagaon' }, { id: 'c', text: 'Sonitpur' }, { id: 'd', text: 'Goalpara' }], correct: 'a', explanation: 'Madan Kamdev temple ruins are known for erotic sculptures and medieval architecture in Kamrup.' },
          { id: 'q25', text: 'Who founded the Indian National Congress session held in Guwahati in 1926?', options: [{ id: 'a', text: 'Srinivasa Iyengar (President) / Reception Committee headed by Tarun Ram Phukan' }, { id: 'b', text: 'Mahatma Gandhi' }, { id: 'c', text: 'Jawaharlal Nehru' }, { id: 'd', text: 'Gopinath Bordoloi' }], correct: 'a', explanation: 'The 41st INC session at Pandu, Guwahati in 1926 was hosted under Tarun Ram Phukan’s leadership.' },
          { id: 'q26', text: 'Who was the leader of the Moamoria Rebellion that shook the Ahom kingdom in the 18th century?', options: [{ id: 'a', text: 'The Matia / Moran followers under Aniruddhadeva’s sect (Mahanta)' }, { id: 'b', text: 'Mughal generals' }, { id: 'c', text: 'Burmese invaders' }, { id: 'd', text: 'Bhutanese rulers' }], correct: 'a', explanation: 'The Moamoria rebellion was led by disciples of the Aniruddhadeva Satra against Ahom royal authority.' },
          { id: 'q27', text: 'What was the primary cause of the Burmese invasions of Assam between 1817 and 1826?', options: [{ id: 'a', text: 'Internal conflicts and appeals for intervention by Ahom nobles (Badan Chandra Borphukan)' }, { id: 'b', text: 'Commercial trade disputes' }, { id: 'c', text: 'Religious crusade' }, { id: 'd', text: 'Mughal instigation' }], correct: 'a', explanation: 'Factional court politics and Badan Chandra’s invitation led to the devastating Burmese invasions (Manor Din).' },
          { id: 'q28', text: 'Who built the majestic Kareng Ghar (Palace) at Garhgaon?', options: [{ id: 'a', text: 'Swargadeo Rajeshwar Singha (brick structure expansion)' }, { id: 'b', text: 'Rudra Singha' }, { id: 'c', text: 'Sukaphaa' }, { id: 'd', text: 'Kamaleswar Singha' }], correct: 'a', explanation: 'The multi-storied brick palace of Kareng Ghar was substantially built by Rajeshwar Singha.' },
          { id: 'q29', text: 'Which British commissioner first administered Assam after the Treaty of Yandaboo?', options: [{ id: 'a', text: 'David Scott' }, { id: 'b', text: 'Francis Jenkins' }, { id: 'c', text: 'Henry Dundas Robertson' }, { id: 'd', text: 'Lord Amherst' }], correct: 'a', explanation: 'David Scott was appointed as the Agent to the Governor-General for the North-East Frontier.' },
          { id: 'q30', text: 'Who was the brave Ahom general who defended Guwahati against Mir Jumla in 1662?', options: [{ id: 'a', text: 'Lachit Borphukan / Momai Tamuli Barbarua context' }, { id: 'b', text: 'Badan Chandra' }, { id: 'c', text: 'Frashuram' }, { id: 'd', text: 'Lachit’s predecessors' }], correct: 'a', explanation: 'Ahom commanders fiercely resisted Mir Jumla’s invasion during the reign of Sutamla (Jayadhwaj Singha).' },
          { id: 'q31', text: 'The ancient city of Sonitpur (Tezpur) is historically associated with the legend of:', options: [{ id: 'a', text: 'King Bana and Usha-Aniruddha romance' }, { id: 'b', text: 'Narakasura' }, { id: 'c', text: 'Bhagadatta' }, { id: 'd', text: 'Mahabharata war heroes only' }], correct: 'a', explanation: 'Tezpur (City of Blood) is linked in folklore to the battle between Lord Krishna and King Bana.' },
          { id: 'q32', text: 'Who was the first President of the Assam Association formed in 1903?', options: [{ id: 'a', text: 'Raja Prabhat Chandra Baruah' }, { id: 'b', text: 'Manik Chandra Baruah' }, { id: 'c', text: 'Tarun Ram Phukan' }, { id: 'd', text: 'Gopinath Bordoloi' }], correct: 'a', explanation: 'Raja Prabhat Chandra Baruah served as the first president of the Assam Association.' },
          { id: 'q33', text: 'When was the University of Gauhati established as the first university in Assam?', options: [{ id: 'a', text: '1948' }, { id: 'b', text: '1950' }, { id: 'c', text: '1960' }, { id: 'd', text: '1935' }], correct: 'a', explanation: 'Gauhati University was established on January 26, 1948.' },
          { id: 'q34', text: 'Who founded the city of Jorhat, which was the last capital of the Ahom kings?', options: [{ id: 'a', text: 'Swargadeo Gaurinath Singha' }, { id: 'b', text: 'Rudra Singha' }, { id: 'c', text: 'Kamaleswar Singha' }, { id: 'd', text: 'Purandeswar Singha' }], correct: 'a', explanation: 'Gaurinath Singha shifted the capital to Jorhat (Cinnamara/Jorhat) in the late 18th century.' },
          { id: 'q35', text: 'What was the historic significance of the "Cunningham Circular" in Assam during freedom struggle?', options: [{ id: 'a', text: 'Banned students from political activity, demanding guardian bond on penalty of expulsion' }, { id: 'b', text: 'Introduced land tax' }, { id: 'c', text: 'Abolished vernacular education' }, { id: 'd', text: 'Imposed curfew' }], correct: 'a', explanation: 'The Cunningham Circular of 1930 sparked massive student protests across Assam.' },
          { id: 'q36', text: 'Who was the founder of the Koch Hajo branch of the Koch dynasty?', options: [{ id: 'a', text: 'Raghudeva' }, { id: 'b', text: 'Naranarayan' }, { id: 'c', text: 'Chilarai' }, { id: 'd', text: 'Biswa Singha' }], correct: 'a', explanation: 'Raghudeva (son of Chilarai) established rule over Koch Hajo after partitioning the kingdom.' },
          { id: 'q37', text: 'The ancient archaeological site of Surya Pahar in Goalpara district is known for:', options: [{ id: 'a', text: 'Vast cluster of rock-cut Shiva lingas, Jain and Buddhist sculptures' }, { id: 'b', text: 'Ahom battlements' }, { id: 'c', text: 'British tea gardens' }, { id: 'd', text: 'Mughal tombs' }], correct: 'a', explanation: 'Sri Surya Pahar is an important multi-religious heritage site with thousands of lingams.' },
          { id: 'q38', text: 'Who authored the famous Assamese novel "Miri Jiyori"?', options: [{ id: 'a', text: 'Rajnikanta Bordoloi' }, { id: 'b', text: 'Lakshminath Bezbaroa' }, { id: 'c', text: 'Padmanath Gohain Baruah' }, { id: 'd', text: 'Benudhar Sharma' }], correct: 'a', explanation: 'Rajnikanta Bordoloi is hailed as the Walter Scott of Assam and author of Miri Jiyori.' },
          { id: 'q39', text: 'Which treaty divided the Kachari kingdom and restricted its borders after conflicts with Ahoms?', options: [{ id: 'a', text: 'Treaty of Asurar Ali' }, { id: 'b', text: 'Treaty of Yandaboo' }, { id: 'c', text: 'Treaty of Ghilajharighat' }, { id: 'd', text: 'Treaty of Gandharbapur' }], correct: 'a', explanation: 'Treaty of Asurar Ali (1639) delineated spheres of influence between the Ahom kingdom and the Mughals.' },
          { id: 'q40', text: 'Who was the first female freedom fighter of Assam who courted arrest in 1921?', options: [{ id: 'a', text: 'Chandraprabha Saikiani' }, { id: 'b', text: 'Pushpalata Das' }, { id: 'c', text: 'Kanaklata Barua' }, { id: 'd', text: 'Bhogeshwari Phukanani' }], correct: 'a', explanation: 'Chandraprabha Saikiani was a pioneering feminist and freedom fighter in Assam.' },
          { id: 'q41', text: 'The ancient capital of the Dimasa Kachari Kingdom was located at:', options: [{ id: 'a', text: 'Maibang and Khaspur' }, { id: 'b', text: 'Charaideo' }, { id: 'c', text: 'Garhgaon' }, { id: 'd', text: 'Rangpur' }], correct: 'a', explanation: 'Dimasa Kachari kings ruled from Dimapur, later shifting to Maibang and Khaspur.' },
          { id: 'q42', text: 'Who was the Chief Commissioner when Assam was separated into a Chief Commissionership in 1874?', options: [{ id: 'a', text: 'Colonel Richard Henry Keatinge' }, { id: 'b', text: 'David Scott' }, { id: 'c', text: 'Francis Jenkins' }, { id: 'd', text: 'Henry Hopkinson' }], correct: 'a', explanation: 'Lt. Colonel R.H. Keatinge became the first Chief Commissioner of Assam in 1874.' },
          { id: 'q43', text: 'Which famous historical place in Sivasagar contains the royal tombs (Maidams) of Ahom kings?', options: [{ id: 'a', text: 'Charaideo' }, { id: 'b', text: 'Garhgaon' }, { id: 'c', text: 'Rangpur' }, { id: 'd', text: 'Joysagar' }], correct: 'a', explanation: 'Charaideo is termed the "Pyramids of Assam", housing the sacred Maidams (tombs) of Ahom monarchs.' },
          { id: 'q44', text: 'Who led the anti-opium campaign in Assam during the Non-Cooperation movement?', options: [{ id: 'a', text: 'Congress leaders and social reformers like Tarun Ram Phukan and Nabin Chandra Bardoloi' }, { id: 'b', text: 'British officers' }, { id: 'c', text: 'Ahom nobles' }, { id: 'd', text: 'Tea planters' }], correct: 'a', explanation: 'Prohibition of opium was a major socio-political plank of the freedom struggle in Assam.' },
          { id: 'q45', text: 'The historic "Assam Accord" was signed on August 15 of which year?', options: [{ id: 'a', text: '1985' }, { id: 'b', text: '1979' }, { id: 'c', text: '1992' }, { id: 'd', text: '1971' }], correct: 'a', explanation: 'The Assam Accord was signed in New Delhi in 1985 between the All Assam Students Union (AASU) and the Government of India.' },
          { id: 'q46', text: 'Who translated the Mahabharata into Assamese verse during the medieval period?', options: [{ id: 'a', text: 'Ram Saraswati and others under patronage' }, { id: 'b', text: 'Sankardev alone' }, { id: 'c', text: 'Bhattadeva' }, { id: 'd', text: 'Madhavdev' }], correct: 'a', explanation: 'Kaviraja Kavi Kandali and Ram Saraswati translated major parts of the Mahabharata into Assamese.' },
          { id: 'q47', text: 'What was the ancient name of the Barak Valley region in epics and historical texts?', options: [{ id: 'a', text: 'Hidimba / Cachar / Hiramba' }, { id: 'b', text: 'Pragiyotishpura' }, { id: 'c', text: 'Kamarupa' }, { id: 'd', text: 'Pundravardhana' }], correct: 'a', explanation: 'Barak Valley region is historically linked with ancient Hiramba / Cachar kingdoms.' },
          { id: 'q48', text: 'Who was the founder of the Jaintia Kingdom in ancient times?', options: [{ id: 'a', text: 'Local indigenous chieftains / Sutnga kings' }, { id: 'b', text: 'Ahom princes' }, { id: 'c', text: 'Koch generals' }, { id: 'd', text: 'Mughal nawabs' }], correct: 'a', explanation: 'The Jaintia (Synteng) kingdom was ruled by the Sutnga royal family.' },
          { id: 'q49', text: 'When was the capital of Assam permanently shifted from Shillong to Dispur?', options: [{ id: 'a', text: '1973' }, { id: 'b', text: '1947' }, { id: 'c', text: '1952' }, { id: 'd', text: '1985' }], correct: 'a', explanation: 'Dispur formally became the capital of Assam in 1973 following Meghalaya’s statehood.' },
          { id: 'q50', text: 'Who was honored with the title "Bir Lachit Borphukan" for his unmatched military leadership?', options: [{ id: 'a', text: 'Lachit Borphukan' }, { id: 'b', text: 'Atan Buragohain' }, { id: 'c', text: 'Laluk Sola Borphukan' }, { id: 'd', text: 'Badan Chandra' }], correct: 'a', explanation: 'Lachit Borphukan remains the legendary military hero of Assam for defeating the Mughals at Saraighat.' },
          { id: 'q51', text: 'Which Indus Valley Civilization site is known for having an artificial dockyard?', options: [{ id: 'a', text: 'Lothal' }, { id: 'b', text: 'Harappa' }, { id: 'c', text: 'Mohenjo-daro' }, { id: 'd', text: 'Kalibangan' }], correct: 'a', explanation: 'Lothal, situated in Gujarat, is famous for its massive brick dockyard.' },
          { id: 'q52', text: 'Where did Gautama Buddha deliver his first sermon?', options: [{ id: 'a', text: 'Sarnath' }, { id: 'b', text: 'Bodh Gaya' }, { id: 'c', text: 'Lumbini' }, { id: 'd', text: 'Kushinagar' }], correct: 'a', explanation: 'Buddha gave his first sermon, known as the Dharmachakra Pravartana, at Sarnath.' },
          { id: 'q53', text: 'Who was the founder of the Maurya Empire?', options: [{ id: 'a', text: 'Chandragupta Maurya' }, { id: 'b', text: 'Ashoka' }, { id: 'c', text: 'Bindusara' }, { id: 'd', text: 'Bimbisara' }], correct: 'a', explanation: 'Chandragupta Maurya founded the empire in 322 BCE after overthrowing the Nanda dynasty.' },
          { id: 'q54', text: 'Which Delhi Sultan introduced the policy of "Blood and Iron"?', options: [{ id: 'a', text: 'Ghiyas ud din Balban' }, { id: 'b', text: 'Alauddin Khalji' }, { id: 'c', text: 'Iltutmish' }, { id: 'd', text: 'Muhammad bin Tughlaq' }], correct: 'a', explanation: 'Balban used ruthless and harsh methods (Blood and Iron) to suppress rebellions and assert authority.' },
          { id: 'q55', text: 'The Second Battle of Panipat was fought in which year?', options: [{ id: 'a', text: '1556' }, { id: 'b', text: '1526' }, { id: 'c', text: '1761' }, { id: 'd', text: '1605' }], correct: 'a', explanation: 'Fought between Akbar\'s forces (led by Bairam Khan) and Hemu in 1556.' },
          { id: 'q56', text: 'Who founded the syncretic religion "Din-i-Ilahi"?', options: [{ id: 'a', text: 'Akbar' }, { id: 'b', text: 'Aurangzeb' }, { id: 'c', text: 'Shah Jahan' }, { id: 'd', text: 'Jahangir' }], correct: 'a', explanation: 'Mughal Emperor Akbar introduced Din-i-Ilahi in 1582 to merge elements of various religions.' },
          { id: 'q57', text: 'Who was the first Viceroy of India?', options: [{ id: 'a', text: 'Lord Canning' }, { id: 'b', text: 'Lord Mountbatten' }, { id: 'c', text: 'Lord Dalhousie' }, { id: 'd', text: 'Lord Curzon' }], correct: 'a', explanation: 'Following the 1857 revolt, the Crown took over, making Governor-General Canning the first Viceroy.' },
          { id: 'q58', text: 'The controversial Partition of Bengal occurred in which year?', options: [{ id: 'a', text: '1905' }, { id: 'b', text: '1911' }, { id: 'c', text: '1899' }, { id: 'd', text: '1907' }], correct: 'a', explanation: 'Lord Curzon partitioned Bengal in 1905, leading to the Swadeshi movement.' },
          { id: 'q59', text: 'The Jallianwala Bagh massacre took place in the year:', options: [{ id: 'a', text: '1919' }, { id: 'b', text: '1920' }, { id: 'c', text: '1917' }, { id: 'd', text: '1922' }], correct: 'a', explanation: 'British troops under Gen Dyer fired on peaceful gatherers in Amritsar on April 13, 1919.' },
          { id: 'q60', text: 'In which year did Mahatma Gandhi launch the Quit India Movement?', options: [{ id: 'a', text: '1942' }, { id: 'b', text: '1930' }, { id: 'c', text: '1940' }, { id: 'd', text: '1945' }], correct: 'a', explanation: 'The movement was launched on August 8, 1942, demanding an end to British rule.' },
          { id: 'q61', text: 'Who is known as the "Frontier Gandhi"?', options: [{ id: 'a', text: 'Khan Abdul Ghaffar Khan' }, { id: 'b', text: 'Maulana Azad' }, { id: 'c', text: 'Lala Lajpat Rai' }, { id: 'd', text: 'Bal Gangadhar Tilak' }], correct: 'a', explanation: 'Khan Abdul Ghaffar Khan was a prominent Pashtun leader and close ally of Gandhi.' },
          { id: 'q62', text: 'Which ruler built the Sanchi Stupa?', options: [{ id: 'a', text: 'Ashoka' }, { id: 'b', text: 'Harsha' }, { id: 'c', text: 'Kanishka' }, { id: 'd', text: 'Chandragupta II' }], correct: 'a', explanation: 'The Great Stupa at Sanchi was originally commissioned by the emperor Ashoka in the 3rd century BCE.' },
          { id: 'q63', text: 'Who composed the national song "Vande Mataram"?', options: [{ id: 'a', text: 'Bankim Chandra Chatterjee' }, { id: 'b', text: 'Rabindranath Tagore' }, { id: 'c', text: 'Muhammad Iqbal' }, { id: 'd', text: 'Sri Aurobindo' }], correct: 'a', explanation: 'It is a poem written in Sanskrit by Bankim Chandra Chatterjee in his 1882 novel Anandamath.' },
          { id: 'q64', text: 'Which session of the INC adopted the resolution for "Purna Swaraj" (Complete Independence)?', options: [{ id: 'a', text: 'Lahore Session, 1929' }, { id: 'b', text: 'Karachi Session, 1931' }, { id: 'c', text: 'Surat Session, 1907' }, { id: 'd', text: 'Lucknow Session, 1916' }], correct: 'a', explanation: 'Presided over by Nehru, the 1929 Lahore session demanded Purna Swaraj.' },
          { id: 'q65', text: 'Who established the "Khalsa" in 1699?', options: [{ id: 'a', text: 'Guru Gobind Singh' }, { id: 'b', text: 'Guru Nanak' }, { id: 'c', text: 'Guru Tegh Bahadur' }, { id: 'd', text: 'Guru Arjan Dev' }], correct: 'a', explanation: 'The tenth Sikh Guru, Guru Gobind Singh, initiated the Khalsa military order.' },
          { id: 'q66', text: 'The Rowlatt Act was passed in which year?', options: [{ id: 'a', text: '1919' }, { id: 'b', text: '1917' }, { id: 'c', text: '1921' }, { id: 'd', text: '1915' }], correct: 'a', explanation: 'The Anarchical and Revolutionary Crimes Act of 1919 allowed incarceration without trial.' },
          { id: 'q67', text: 'Who was the founder of the Brahmo Samaj?', options: [{ id: 'a', text: 'Raja Ram Mohan Roy' }, { id: 'b', text: 'Swami Vivekananda' }, { id: 'c', text: 'Dayananda Saraswati' }, { id: 'd', text: 'Keshab Chandra Sen' }], correct: 'a', explanation: 'Raja Ram Mohan Roy founded the Brahmo Sabha in 1828 for socio-religious reform.' },
          { id: 'q68', text: 'The capital of the Magadha Empire under the Mauryas was:', options: [{ id: 'a', text: 'Pataliputra' }, { id: 'b', text: 'Rajagriha' }, { id: 'c', text: 'Ujjain' }, { id: 'd', text: 'Taxila' }], correct: 'a', explanation: 'Pataliputra (modern-day Patna) was the majestic capital of the Mauryan empire.' },
          { id: 'q69', text: 'Which British Governor-General introduced the "Doctrine of Lapse"?', options: [{ id: 'a', text: 'Lord Dalhousie' }, { id: 'b', text: 'Lord Wellesley' }, { id: 'c', text: 'Lord Hastings' }, { id: 'd', text: 'Lord Cornwallis' }], correct: 'a', explanation: 'Dalhousie used this annexation policy extensively to expand British territories.' },
          { id: 'q70', text: 'Who wrote the "Arthashastra"?', options: [{ id: 'a', text: 'Chanakya (Kautilya)' }, { id: 'b', text: 'Megasthenes' }, { id: 'c', text: 'Kalidasa' }, { id: 'd', text: 'Banabhatta' }], correct: 'a', explanation: 'Chanakya, the royal advisor to Chandragupta Maurya, authored this treatise on statecraft.' },
          { id: 'q71', text: 'The non-cooperation movement was called off in 1922 due to which incident?', options: [{ id: 'a', text: 'Chauri Chaura incident' }, { id: 'b', text: 'Kakori Train Robbery' }, { id: 'c', text: 'Jallianwala Bagh massacre' }, { id: 'd', text: 'Simon Commission arrival' }], correct: 'a', explanation: 'Gandhi halted the movement after a violent mob burnt a police station at Chauri Chaura.' },
          { id: 'q72', text: 'The famous "Dandi March" was a part of which movement?', options: [{ id: 'a', text: 'Civil Disobedience Movement' }, { id: 'b', text: 'Non-Cooperation Movement' }, { id: 'c', text: 'Quit India Movement' }, { id: 'd', text: 'Swadeshi Movement' }], correct: 'a', explanation: 'The 1930 Salt March initiated the nationwide Civil Disobedience Movement.' },
          { id: 'q73', text: 'Who was the first woman President of the Indian National Congress?', options: [{ id: 'a', text: 'Annie Besant' }, { id: 'b', text: 'Sarojini Naidu' }, { id: 'c', text: 'Indira Gandhi' }, { id: 'd', text: 'Madam Cama' }], correct: 'a', explanation: 'Annie Besant presided over the 1917 Calcutta session.' },
          { id: 'q74', text: 'Which ancient university was an important center of Buddhist learning?', options: [{ id: 'a', text: 'Nalanda' }, { id: 'b', text: 'Taxila' }, { id: 'c', text: 'Ujjain' }, { id: 'd', text: 'Kanchi' }], correct: 'a', explanation: 'Nalanda, in modern Bihar, was a globally renowned ancient center of learning.' },
          { id: 'q75', text: 'The Vijayanagara Empire was founded by:', options: [{ id: 'a', text: 'Harihara and Bukka' }, { id: 'b', text: 'Krishnadevaraya' }, { id: 'c', text: 'Shivaji' }, { id: 'd', text: 'Rajaraja Chola' }], correct: 'a', explanation: 'The brothers Harihara I and Bukka Raya I founded the empire in 1336.' },
          { id: 'q76', text: 'Who gave the slogan "Give me blood, and I shall give you freedom"?', options: [{ id: 'a', text: 'Subhas Chandra Bose' }, { id: 'b', text: 'Bhagat Singh' }, { id: 'c', text: 'Chandrashekhar Azad' }, { id: 'd', text: 'Lala Lajpat Rai' }], correct: 'a', explanation: 'Netaji Subhas Chandra Bose famously used this slogan to motivate the INA.' },
          { id: 'q77', text: 'The Mughal Emperor who built the Taj Mahal is:', options: [{ id: 'a', text: 'Shah Jahan' }, { id: 'b', text: 'Akbar' }, { id: 'c', text: 'Jahangir' }, { id: 'd', text: 'Aurangzeb' }], correct: 'a', explanation: 'Shah Jahan built it in memory of his wife Mumtaz Mahal.' },
          { id: 'q78', text: 'Who was known as the "Iron Man of India"?', options: [{ id: 'a', text: 'Sardar Vallabhbhai Patel' }, { id: 'b', text: 'B.R. Ambedkar' }, { id: 'c', text: 'Subhas Chandra Bose' }, { id: 'd', text: 'Dadabhai Naoroji' }], correct: 'a', explanation: 'Patel is known as the Iron Man for uniting hundreds of princely states post-independence.' },
          { id: 'q79', text: 'The First Battle of Tarain in 1191 was fought between:', options: [{ id: 'a', text: 'Prithviraj Chauhan and Muhammad Ghori' }, { id: 'b', text: 'Babur and Ibrahim Lodi' }, { id: 'c', text: 'Akbar and Hemu' }, { id: 'd', text: 'Mahmud of Ghazni and Jaichand' }], correct: 'a', explanation: 'Prithviraj defeated Ghori in the first battle but lost the second the following year.' },
          { id: 'q80', text: 'The term "Tirthankara" is associated with which religion?', options: [{ id: 'a', text: 'Jainism' }, { id: 'b', text: 'Buddhism' }, { id: 'c', text: 'Hinduism' }, { id: 'd', text: 'Sikhism' }], correct: 'a', explanation: 'A Tirthankara is a savior and spiritual teacher of the dharma in Jainism (24 in total).' },
          { id: 'q81', text: 'Who was the founder of the Ramakrishna Mission?', options: [{ id: 'a', text: 'Swami Vivekananda' }, { id: 'b', text: 'Ramakrishna Paramahamsa' }, { id: 'c', text: 'Dayananda Saraswati' }, { id: 'd', text: 'Raja Ram Mohan Roy' }], correct: 'a', explanation: 'Vivekananda founded the mission in 1897 in honor of his guru.' },
          { id: 'q82', text: 'Who composed the epic poem "Ramcharitmanas"?', options: [{ id: 'a', text: 'Tulsidas' }, { id: 'b', text: 'Valmiki' }, { id: 'c', text: 'Kabir' }, { id: 'd', text: 'Surdas' }], correct: 'a', explanation: 'Goswami Tulsidas authored the Awadhi rendition of the Ramayana in the 16th century.' },
          { id: 'q83', text: 'Which Governor-General is associated with the introduction of English education in India?', options: [{ id: 'a', text: 'Lord William Bentinck (with Macaulay)' }, { id: 'b', text: 'Lord Dalhousie' }, { id: 'c', text: 'Lord Cornwallis' }, { id: 'd', text: 'Lord Ripon' }], correct: 'a', explanation: 'Following Macaulay\'s Minute (1835), Bentinck introduced English as the medium of higher education.' },
          { id: 'q84', text: 'The famous traveler Ibn Battuta visited India from which country?', options: [{ id: 'a', text: 'Morocco' }, { id: 'b', text: 'Persia' }, { id: 'c', text: 'Italy' }, { id: 'd', text: 'China' }], correct: 'a', explanation: 'Ibn Battuta was a Moroccan explorer who served under Muhammad bin Tughlaq.' },
          { id: 'q85', text: 'Who was the political guru of Mahatma Gandhi?', options: [{ id: 'a', text: 'Gopal Krishna Gokhale' }, { id: 'b', text: 'Bal Gangadhar Tilak' }, { id: 'c', text: 'Dadabhai Naoroji' }, { id: 'd', text: 'Leo Tolstoy' }], correct: 'a', explanation: 'Gokhale guided Gandhi on Indian politics when he returned from South Africa.' },
          { id: 'q86', text: 'Which is the oldest Veda?', options: [{ id: 'a', text: 'Rig Veda' }, { id: 'b', text: 'Sama Veda' }, { id: 'c', text: 'Yajur Veda' }, { id: 'd', text: 'Atharva Veda' }], correct: 'a', explanation: 'The Rig Veda is the oldest known Vedic Sanskrit text.' },
          { id: 'q87', text: 'Who among the following was the founder of the Gupta Dynasty?', options: [{ id: 'a', text: 'Sri Gupta' }, { id: 'b', text: 'Chandragupta I' }, { id: 'c', text: 'Samudragupta' }, { id: 'd', text: 'Kumargupta' }], correct: 'a', explanation: 'Sri Gupta is credited as the founder of the Gupta Empire in the late 3rd century.' },
          { id: 'q88', text: 'In which language were the original Buddhist texts (Tripitakas) written?', options: [{ id: 'a', text: 'Pali' }, { id: 'b', text: 'Sanskrit' }, { id: 'c', text: 'Prakrit' }, { id: 'd', text: 'Brahmi' }], correct: 'a', explanation: 'The Theravada Buddhist canon was compiled in the Pali language.' },
          { id: 'q89', text: 'Who built the famous Khajuraho Stupas/Temples?', options: [{ id: 'a', text: 'Chandela Kings' }, { id: 'b', text: 'Gupta Kings' }, { id: 'c', text: 'Mauryan Kings' }, { id: 'd', text: 'Chola Kings' }], correct: 'a', explanation: 'The Chandela dynasty built the spectacular temple complex between 950 and 1050 AD.' },
          { id: 'q90', text: 'Who was the last Mughal Emperor of India?', options: [{ id: 'a', text: 'Bahadur Shah Zafar II' }, { id: 'b', text: 'Aurangzeb' }, { id: 'c', text: 'Shah Alam II' }, { id: 'd', text: 'Jahangir' }], correct: 'a', explanation: 'He was deposed and exiled to Rangoon by the British after the 1857 revolt.' },
          { id: 'q91', text: 'Which Chola king is famous for his naval expeditions to Southeast Asia?', options: [{ id: 'a', text: 'Rajendra Chola I' }, { id: 'b', text: 'Rajaraja Chola I' }, { id: 'c', text: 'Parantaka Chola' }, { id: 'd', text: 'Aditya Chola' }], correct: 'a', explanation: 'Rajendra Chola I expanded the empire across the ocean to Sri Vijaya (Indonesia/Malaysia).' },
          { id: 'q92', text: 'The "Simon Commission" visited India in the year:', options: [{ id: 'a', text: '1928' }, { id: 'b', text: '1925' }, { id: 'c', text: '1930' }, { id: 'd', text: '1919' }], correct: 'a', explanation: 'The all-white commission arrived in 1928 to report on Indian constitutional progress.' },
          { id: 'q93', text: 'Who was the first Indian to pass the Indian Civil Service (ICS) examination?', options: [{ id: 'a', text: 'Satyendranath Tagore' }, { id: 'b', text: 'Surendranath Banerjee' }, { id: 'c', text: 'Anundoram Borooah' }, { id: 'd', text: 'Dadabhai Naoroji' }], correct: 'a', explanation: 'Satyendranath Tagore (brother of Rabindranath) cleared the exam in 1863.' },
          { id: 'q94', text: 'The permanent settlement of Bengal was introduced by:', options: [{ id: 'a', text: 'Lord Cornwallis' }, { id: 'b', text: 'Lord Warren Hastings' }, { id: 'c', text: 'Lord Wellesley' }, { id: 'd', text: 'Lord Curzon' }], correct: 'a', explanation: 'Cornwallis introduced the Zamindari system for revenue collection in 1793.' },
          { id: 'q95', text: 'Which session of the Indian National Congress split into Extremists and Moderates?', options: [{ id: 'a', text: 'Surat Session (1907)' }, { id: 'b', text: 'Calcutta Session (1906)' }, { id: 'c', text: 'Lahore Session (1909)' }, { id: 'd', text: 'Lucknow Session (1916)' }], correct: 'a', explanation: 'The famous "Surat Split" divided the INC into two ideological factions.' },
          { id: 'q96', text: 'Who is the author of "Gitanjali"?', options: [{ id: 'a', text: 'Rabindranath Tagore' }, { id: 'b', text: 'Bankim Chandra Chatterjee' }, { id: 'c', text: 'Sarat Chandra Chattopadhyay' }, { id: 'd', text: 'Mahadevi Varma' }], correct: 'a', explanation: 'Tagore won the Nobel Prize in Literature in 1913 for his poetry collection Gitanjali.' },
          { id: 'q97', text: 'The Gandhi-Irwin Pact was signed in which year?', options: [{ id: 'a', text: '1931' }, { id: 'b', text: '1930' }, { id: 'c', text: '1932' }, { id: 'd', text: '1929' }], correct: 'a', explanation: 'The pact paved the way for Gandhi to participate in the Second Round Table Conference.' },
          { id: 'q98', text: 'Which ancient text is known as the oldest grammar text in the world?', options: [{ id: 'a', text: 'Ashtadhyayi by Panini' }, { id: 'b', text: 'Mahabhashya by Patanjali' }, { id: 'c', text: 'Natyashastra by Bharata' }, { id: 'd', text: 'Manusmriti' }], correct: 'a', explanation: 'Panini’s Ashtadhyayi rigorously outlines the rules of classical Sanskrit.' },
          { id: 'q99', text: 'The Red Fort in Delhi was constructed by:', options: [{ id: 'a', text: 'Shah Jahan' }, { id: 'b', text: 'Akbar' }, { id: 'c', text: 'Humayun' }, { id: 'd', text: 'Jahangir' }], correct: 'a', explanation: 'Shah Jahan built the Lal Qila when he shifted the capital from Agra to Delhi.' },
          { id: 'q100', text: 'Which British officer is infamous for ordering the Jallianwala Bagh massacre?', options: [{ id: 'a', text: 'Reginald Dyer' }, { id: 'b', text: 'Michael O’Dwyer' }, { id: 'c', text: 'Lord Chelmsford' }, { id: 'd', text: 'John Simon' }], correct: 'a', explanation: 'Brigadier-General Reginald Dyer commanded the troops that fired into the crowd.' }
        ]
      },
      reasoning: {
        id: 'reasoning',
        title: 'Reasoning & Aptitude',
        icon: 'lightbulb',
        color: 'rose',
        questions: [
          { id: 'q1', text: 'If "ROSE" is coded as 6821, "CHAIR" is coded as 73456 and "PREACH" is coded as 961473, what will be the code for "SEARCH"?', options: [{ id: 'a', text: '214673' }, { id: 'b', text: '214763' }, { id: 'c', text: '214637' }, { id: 'd', text: '241673' }], correct: 'a', explanation: 'By direct substitution from the given words: S=2, E=1, A=4, R=6, C=7, H=3. Therefore, SEARCH is 214673.' },
          { id: 'q2', text: 'In a certain code language, "COMPUTER" is written as "RFUVQNPC". How will "MEDICINE" be written in that code language?', options: [{ id: 'a', text: 'MFEDJJOE' }, { id: 'b', text: 'EOJDEJFM' }, { id: 'c', text: 'MFEJDJOE' }, { id: 'd', text: 'EOJDJEFM' }], correct: 'b', explanation: 'The word is reversed, and then each letter is shifted by +1. MEDICINE reversed is ENICIDEM. Shifting by +1 gives EOJDEJFM.' },
          { id: 'q3', text: 'If A is the brother of B; B is the sister of C; and C is the father of D, how D is related to A?', options: [{ id: 'a', text: 'Brother' }, { id: 'b', text: 'Sister' }, { id: 'c', text: 'Nephew or Niece' }, { id: 'd', text: 'Cannot be determined' }], correct: 'c', explanation: 'A, B, and C are siblings. C is the father of D. Therefore, A is the uncle of D, making D the nephew or niece of A (gender of D is unknown).' },
          { id: 'q4', text: 'Pointing to a photograph of a boy, Suresh said, "He is the son of the only son of my mother." How is Suresh related to that boy?', options: [{ id: 'a', text: 'Brother' }, { id: 'b', text: 'Uncle' }, { id: 'c', text: 'Cousin' }, { id: 'd', text: 'Father' }], correct: 'd', explanation: 'The "only son of my mother" refers to Suresh himself. Therefore, the boy is Suresh\'s son.' },
          { id: 'q5', text: 'A man walks 5 km toward south and then turns to the right. After walking 3 km he turns to the left and walks 5 km. Now in which direction is he from the starting place?', options: [{ id: 'a', text: 'West' }, { id: 'b', text: 'South' }, { id: 'c', text: 'North-East' }, { id: 'd', text: 'South-West' }], correct: 'd', explanation: 'He goes 5 km South, then 3 km West (right turn from South), then 5 km South (left turn from West). He is overall South and West of his starting point.' },
          { id: 'q6', text: 'One morning after sunrise, Vimal started to walk. During this walking he met Stephen who was coming from opposite direction. Vimal watch that the shadow of Stephen to the right of him (Vimal). To Which direction Vimal was facing?', options: [{ id: 'a', text: 'East' }, { id: 'b', text: 'West' }, { id: 'c', text: 'South' }, { id: 'd', text: 'North' }], correct: 'c', explanation: 'Sun is in the East in the morning. Shadows fall towards the West. If the shadow is to Vimal\'s right, his right side is West. Therefore, Vimal is facing South.' },
          { id: 'q7', text: 'Find the next number in the series: 2, 5, 9, 19, 37, ?', options: [{ id: 'a', text: '73' }, { id: 'b', text: '75' }, { id: 'c', text: '76' }, { id: 'd', text: '78' }], correct: 'b', explanation: 'The pattern is: x2 + 1, x2 - 1, x2 + 1, x2 - 1... (2x2+1=5, 5x2-1=9, 9x2+1=19, 19x2-1=37). Next is 37x2 + 1 = 75.' },
          { id: 'q8', text: 'Look at this series: 12, 11, 13, 12, 14, 13, ... What number should come next?', options: [{ id: 'a', text: '10' }, { id: 'b', text: '16' }, { id: 'c', text: '13' }, { id: 'd', text: '15' }], correct: 'd', explanation: 'This is an alternating addition and subtraction series: -1, +2, -1, +2... 13 + 2 = 15.' },
          { id: 'q9', text: 'Identify the odd one out from the following: Dog, Horse, Wolf, Jackal', options: [{ id: 'a', text: 'Dog' }, { id: 'b', text: 'Horse' }, { id: 'c', text: 'Wolf' }, { id: 'd', text: 'Jackal' }], correct: 'b', explanation: 'Dog, Wolf, and Jackal all belong to the canine family (carnivores). A horse is a herbivore and an equine.' },
          { id: 'q10', text: 'Choose the odd numeral pair/group: (144, 12), (169, 13), (196, 14), (210, 15)', options: [{ id: 'a', text: '(144, 12)' }, { id: 'b', text: '(169, 13)' }, { id: 'c', text: '(196, 14)' }, { id: 'd', text: '(210, 15)' }], correct: 'd', explanation: 'The first number is the square of the second number. 15 squared is 225, not 210.' },
