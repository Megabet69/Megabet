<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assam Exam Prep Pro</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

  <!-- Firebase -->

  
  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    .fade-in { animation: fadeIn 0.5s ease-out; }
    .slide-up { animation: slideUp 0.5s ease-out; }
    .animate-spin { animation: spin 1s linear infinite; }
    
    .btn { padding: 0.625rem 1.5rem; border-radius: 0.5rem; font-weight: 500; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; cursor: pointer; border: none; outline: none; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background-color: #2563eb; color: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    .btn-primary:hover:not(:disabled) { background-color: #1d4ed8; }
    .btn-secondary { background-color: white; color: #1f2937; border: 1px solid #d1d5db; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
    .btn-secondary:hover:not(:disabled) { background-color: #f9fafb; }
    .btn-danger { background-color: #ef4444; color: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    .btn-danger:hover:not(:disabled) { background-color: #dc2626; }
    .btn-success { background-color: #16a34a; color: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    .btn-success:hover:not(:disabled) { background-color: #15803d; }
    .btn-outline { background-color: transparent; color: #2563eb; border: 2px solid #2563eb; }
    .btn-outline:hover:not(:disabled) { background-color: #eff6ff; }
  
    /* Mobile-safe leaderboard + chat */
    .mobile-safe { min-width: 0; }
    .leaderboard-row { min-width: 0; }
    .leaderboard-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 640px) {
      .leaderboard-row { padding: 12px !important; gap: 9px !important; }
      .leaderboard-rank { width: 32px !important; height: 32px !important; font-size: 12px !important; }
      .leaderboard-avatar { width: 38px !important; height: 38px !important; font-size: 21px !important; }
      .leaderboard-accuracy { margin-left: 0 !important; margin-right: 0 !important; }
      .leaderboard-accuracy p:first-child { font-size: 13px !important; }
      .leaderboard-message { width: 36px !important; height: 36px !important; flex-shrink: 0; }
      .mobile-toolbar { width: 100%; }
      .mobile-toolbar .btn { flex: 1; justify-content: center; }
      .chat-shell { height: calc(100dvh - 115px) !important; min-height: 430px !important; border-radius: 16px !important; }
      .chat-composer { padding: 9px !important; }
      .chat-composer input { min-width: 0; }
      .chat-send-text { display: none !important; }
    }

</style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-10 border-b border-gray-200">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-blue-600 text-white p-2 rounded-lg">
          <i data-lucide="book-open" class="w-6 h-6"></i>
        </div>
        <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-700 to-indigo-700 hidden sm:block">
          Assam Exam Prep Pro
        </h1>
      </div>
      <div class="flex items-center gap-3"><span id="firebase-status" class="text-xs px-2.5 py-1 rounded-full border font-semibold bg-yellow-50 text-yellow-700 border-yellow-200">Connecting...</span><div id="header-profile" class="flex items-center gap-4"></div></div>
    </div>
  </header>

  <!-- Main App Container -->
  <main id="app-root" class="max-w-5xl mx-auto p-4 md:p-6 pb-20 w-full flex-grow"></main>

  <!-- Global Modal Container -->
  <div id="modal-container" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 fade-in">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 slide-up">
      <h3 id="modal-title" class="text-xl font-bold text-gray-900 mb-2"></h3>
      <p id="modal-message" class="text-gray-600 mb-6"></p>
      <div class="flex justify-end gap-3">
        <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
        <button id="modal-confirm" class="btn btn-primary">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    // --- Quiz Data ---
    const quizData = {
      adre: {
        id: 'adre',
        title: 'ADRE 3.0 Mock Test',
        icon: 'book-open',
        color: 'blue',
        questions: [
          { id: 'q1', text: 'Who was the first Chief Minister of Independent Assam?', options: [{ id: 'a', text: 'Tarun Ram Phukan' }, { id: 'b', text: 'Gopinath Bordoloi' }, { id: 'c', text: 'Bishnuram Medhi' }, { id: 'd', text: 'Bimala Prasad Chaliha' }], correct: 'b', explanation: 'Gopinath Bordoloi was the first Chief Minister of Assam after India gained independence and played a vital role in keeping Assam within India.' },
          { id: 'q2', text: 'Which state tree of Assam is valued for its towering height and quality timber?', options: [{ id: 'a', text: 'Peepal' }, { id: 'b', text: 'Hollong' }, { id: 'c', text: 'Banyan' }, { id: 'd', text: 'Sal' }], correct: 'b', explanation: 'Hollong (Dipterocarpus macrocarpus) is officially designated as the State Tree of Assam.' },
          { id: 'q3', text: 'In which year was Kaziranga declared as a National Park?', options: [{ id: 'a', text: '1905' }, { id: 'b', text: '1950' }, { id: 'c', text: '1974' }, { id: 'd', text: '1985' }], correct: 'c', explanation: 'Kaziranga was declared a National Park in 1974 by the Government of India and became a UNESCO World Heritage site in 1985.' },
          { id: 'q4', text: 'Who is the author of the famous devotional text "Kirtan Ghosa"?', options: [{ id: 'a', text: 'Madhavdev' }, { id: 'b', text: 'Srimanta Sankardev' }, { id: 'c', text: 'Bhattadeva' }, { id: 'd', text: 'Damodardev' }], correct: 'b', explanation: 'Kirtan Ghosa was compiled and written by the great Vaishnavite reformer Srimanta Sankardev.' },
          { id: 'q5', text: 'Which river is the largest northern tributary of the Brahmaputra in Assam?', options: [{ id: 'a', text: 'Manas' }, { id: 'b', text: 'Subansiri' }, { id: 'c', text: 'Dhansiri' }, { id: 'd', text: 'Kopili' }], correct: 'b', explanation: 'Subansiri River originating from the Himalayas is the largest tributary of the Brahmaputra by volume.' },
          { id: 'q6', text: 'Dehing Patkai National Park is situated across which districts of Assam?', options: [{ id: 'a', text: 'Dibrugarh and Tinsukia' }, { id: 'b', text: 'Golaghat and Nagaon' }, { id: 'c', text: 'Sonitpur and Biswanath' }, { id: 'd', text: 'Jorhat and Sivasagar' }], correct: 'a', explanation: 'Dehing Patkai rainforest spans the districts of Dibrugarh and Tinsukia.' },
          { id: 'q7', text: 'What does the word "Asom" or "Assam" traditionally derive from?', options: [{ id: 'a', text: 'Land of Red River and Blue Hills' }, { id: 'b', text: 'Derived from the Tai word "Asama" meaning peerless' }, { id: 'c', text: 'Land of Tea and Silk' }, { id: 'd', text: 'Named after King Asura' }], correct: 'b', explanation: 'Historians believe Assam derives its name from the Ahom dynasty rule, connected to the Tai word "Asama" (uneven or peerless).' },
          { id: 'q8', text: 'Sarthebari in Barpeta district is famous for which traditional craft?', options: [{ id: 'a', text: 'Bell-metal and Brassware' }, { id: 'b', text: 'Muga Silk Weaving' }, { id: 'c', text: 'Terracotta Pottery' }, { id: 'd', text: 'Bamboo Handicrafts' }], correct: 'a', explanation: 'Sarthebari is renowned across India for its bell-metal craft (Kanh industry).' },
          { id: 'q9', text: 'The Naranarayan Setu bridge connects which two points across the Brahmaputra?', options: [{ id: 'a', text: 'Pancharatna and Jogighopa' }, { id: 'b', text: 'Guwahati and North Guwahati' }, { id: 'c', text: 'Tezpur and Kaliabor' }, { id: 'd', text: 'Dibrugarh and Dhemaji' }], correct: 'a', explanation: 'Naranarayan Setu links Pancharatna on the south bank to Jogighopa on the north bank.' },
          { id: 'q10', text: 'Who was the first Assamese writer to receive the prestigious Sahitya Akademi Award?', options: [{ id: 'a', text: 'Birendra Kumar Bhattacharya' }, { id: 'b', text: 'Jatindranath Duwara' }, { id: 'c', text: 'Hemchandra Barua' }, { id: 'd', text: 'Nabakanta Barua' }], correct: 'b', explanation: 'Jatindranath Duwara won the award in 1952 for his poetry collection "Bana Phul".' },
          { id: 'q11', text: 'Which district in Assam has the highest forest cover according to recent reports?', options: [{ id: 'a', text: 'Karbi Anglong' }, { id: 'b', text: 'Dima Hasao' }, { id: 'c', text: 'Kokrajhar' }, { id: 'd', text: 'Lakhimpur' }], correct: 'a', explanation: 'Karbi Anglong district traditionally records the largest area under forest cover in Assam.' },
          { id: 'q12', text: 'The famous Joy Sagar tank, the biggest man-made lake in Assam, was excavated by:', options: [{ id: 'a', text: 'Rudra Singha' }, { id: 'b', text: 'Siva Singha' }, { id: 'c', text: 'Gadapani' }, { id: 'd', text: 'Pramatta Singha' }], correct: 'a', explanation: 'King Rudra Singha excavated Joysagar tank in memory of his mother Joymoti Kuwari.' },
          { id: 'q13', text: 'Where is the headquarters of North Eastern Development Finance Corporation Limited (NEDFi) located?', options: [{ id: 'a', text: 'Shillong' }, { id: 'b', text: 'Guwahati' }, { id: 'c', text: 'Dispur' }, { id: 'd', text: 'Dibrugarh' }], correct: 'b', explanation: 'NEDFi corporate office is situated in Guwahati, Assam.' },
          { id: 'q14', text: 'Which bird is known as the State Bird of Assam?', options: [{ id: 'a', text: 'White-winged Wood Duck (Deohanh)' }, { id: 'b', text: 'Great Hornbill' }, { id: 'c', text: 'Hill Myna' }, { id: 'd', text: 'Bengal Florican' }], correct: 'a', explanation: 'The endangered White-winged Wood Duck is the state bird of Assam.' },
          { id: 'q15', text: 'The Numaligarh Refinery Limited (NRL) refinery is located in which district?', options: [{ id: 'a', text: 'Golaghat' }, { id: 'b', text: 'Jorhat' }, { id: 'c', text: 'Tinsukia' }, { id: 'd', text: 'Bongaigaon' }], correct: 'a', explanation: 'NRL is located at Morangi in Golaghat district.' },
          { id: 'q16', text: 'Who founded the city of Pragiyotishpura according to mythological traditions?', options: [{ id: 'a', text: 'Narakasura' }, { id: 'b', text: 'Bhagadatta' }, { id: 'c', text: 'Banasura' }, { id: 'd', text: 'Mahiravana' }], correct: 'a', explanation: 'Narakasura is traditionally credited with establishing the kingdom of Pragiyotishpura.' },
          { id: 'q17', text: 'Which wildlife sanctuary in Assam is famous for the Golden Langur?', options: [{ id: 'a', text: 'Chakrashila' }, { id: 'b', text: 'Pobitora' }, { id: 'c', text: 'Bornadi' }, { id: 'd', text: 'Garampani' }], correct: 'a', explanation: 'Chakrashila Wildlife Sanctuary is noted for preserving the Golden Langur.' },
          { id: 'q18', text: 'Who composed the famous Assamese patriotic song "O Mor Apunar Desh"?', options: [{ id: 'a', text: 'Lakshminath Bezbaroa' }, { id: 'b', text: 'Ambikagiri Raichoudhury' }, { id: 'c', text: 'Jyotiprasad Agarwala' }, { id: 'd', text: 'Bishnu Prasad Rabha' }], correct: 'a', explanation: 'Lakshminath Bezbaroa wrote "O Mor Apunar Desh", which is the state song of Assam.' },
          { id: 'q19', text: 'The Bogibeel Bridge, India’s longest rail-cum-road bridge, is built over which river?', options: [{ id: 'a', text: 'Brahmaputra' }, { id: 'b', text: 'Barak' }, { id: 'c', text: 'Subansiri' }, { id: 'd', text: 'Manas' }], correct: 'a', explanation: 'Bogibeel Bridge spans the Brahmaputra River connecting Dhemaji and Dibrugarh.' },
          { id: 'q20', text: 'Which of the following is a UNESCO World Heritage Site in Assam along with Kaziranga?', options: [{ id: 'a', text: 'Manas National Park' }, { id: 'b', text: 'Majuli Island' }, { id: 'c', text: 'Kamakhya Temple' }, { id: 'd', text: 'Umananda Island' }], correct: 'a', explanation: 'Manas National Park is a UNESCO World Heritage Site located in western Assam.' },
          { id: 'q21', text: 'The Bhupen Hazarika Setu (Dhola-Sadiya Bridge) is built over which tributary/river?', options: [{ id: 'a', text: 'Lohit River' }, { id: 'b', text: 'Siang River' }, { id: 'c', text: 'Dibang River' }, { id: 'd', text: 'Brahmaputra main channel' }], correct: 'a', explanation: 'Dhola-Sadiya Bridge spans the Lohit River, a major tributary of the Brahmaputra.' },
          { id: 'q22', text: 'Who was the first person from Assam to receive the prestigious Padma Shri award?', options: [{ id: 'a', text: 'Nalinibala Devi' }, { id: 'b', text: 'Amulya Chandra Hazarika' }, { id: 'c', text: 'Bishnuram Medhi' }, { id: 'd', text: 'Radhakanta Handique' }], correct: 'a', explanation: 'Noted poet Nalinibala Devi received the Padma Shri in 1957.' },
          { id: 'q23', text: 'Which place in Assam is renowned for traditional Muga silk production?', options: [{ id: 'a', text: 'Sualkuchi' }, { id: 'b', text: 'Sarthebari' }, { id: 'c', text: 'Sivasagar' }, { id: 'd', text: 'Barpeta' }], correct: 'a', explanation: 'Sualkuchi, known as the "Manchester of Assam", is famous for its silk weaving.' },
          { id: 'q24', text: 'What is the official state animal of Assam?', options: [{ id: 'a', text: 'One-horned Rhinoceros' }, { id: 'b', text: 'Royal Bengal Tiger' }, { id: 'c', text: 'Hoolock Gibbon' }, { id: 'd', text: 'Asian Elephant' }], correct: 'a', explanation: 'The Great Indian One-horned Rhinoceros is the state animal of Assam.' },
          { id: 'q25', text: 'The capital of the Ahom kingdom was shifted to Garhgaon by which king?', options: [{ id: 'a', text: 'Suhungmung (Dihingia Raja)' }, { id: 'b', text: 'Sukaphaa' }, { id: 'c', text: 'Pratap Singha' }, { id: 'd', text: 'Rudra Singha' }], correct: 'a', explanation: 'Suhungmung established Garhgaon as the Ahom capital in the 16th century.' },
          { id: 'q26', text: 'Which district of Assam shares an international border with Bhutan?', options: [{ id: 'a', text: 'Kokrajhar' }, { id: 'b', text: 'Cachar' }, { id: 'c', text: 'Jorhat' }, { id: 'd', text: 'Dibrugarh' }], correct: 'a', explanation: 'Kokrajhar along with districts like Chirang, Baksa, and Udalguri borders Bhutan.' },
          { id: 'q27', text: 'Who was the editor of the historic Assamese monthly magazine "Jonaki"?', options: [{ id: 'a', text: 'Chandrakumar Agarwala' }, { id: 'b', text: 'Hemchandra Barua' }, { id: 'c', text: 'Gunabhiram Barua' }, { id: 'd', text: 'Padmanath Gohain Baruah' }], correct: 'a', explanation: 'Chandrakumar Agarwala was the first editor of Jonaki, which marked the romantic era in Assamese literature.' },
          { id: 'q28', text: 'When was the Guwahati Refinery, the first public sector refinery in India, commissioned?', options: [{ id: 'a', text: '1962' }, { id: 'b', text: '1955' }, { id: 'c', text: '1971' }, { id: 'd', text: '1948' }], correct: 'a', explanation: 'Guwahati Refinery at Noonmati was inaugurated in January 1962.' },
          { id: 'q29', text: 'The famous Ambubachi Mela is held annually at which religious site?', options: [{ id: 'a', text: 'Kamakhya Temple, Guwahati' }, { id: 'b', text: 'Hayagriva Madhava Temple, Hajo' }, { id: 'c', text: 'Ugratara Temple' }, { id: 'd', text: 'Batadrava Than' }], correct: 'a', explanation: 'Ambubachi Mela takes place every year during monsoon at the Kamakhya Temple.' },
          { id: 'q30', text: 'Which river forms the eastern boundary of the Kaziranga National Park?', options: [{ id: 'a', text: 'Dhaniakhana / Mora Diphlu' }, { id: 'b', text: 'Brahmaputra' }, { id: 'c', text: 'Dhansiri' }, { id: 'd', text: 'Belsiri' }], correct: 'a', explanation: 'Diphlu and Mora Diphlu flow through and around Kaziranga.' },
          { id: 'q31', text: 'Who wrote the famous historical drama "Joymoti"?', options: [{ id: 'a', text: 'Padmanath Gohain Baruah' }, { id: 'b', text: 'Jyotiprasad Agarwala' }, { id: 'c', text: 'Lakshminath Bezbaroa' }, { id: 'd', text: 'Benudhar Sharma' }], correct: 'a', explanation: 'Padmanath Gohain Baruah wrote the play "Joymoti" in 1900.' },
          { id: 'q32', text: 'Which town in Assam is known as the "Tea City of India"?', options: [{ id: 'a', text: 'Dibrugarh' }, { id: 'b', text: 'Jorhat' }, { id: 'c', text: 'Tinsukia' }, { id: 'd', text: 'Silchar' }], correct: 'a', explanation: 'Dibrugarh is widely referred to as the Tea City of India due to its vast tea estates.' },
          { id: 'q33', text: 'The Assam Agricultural University is located at:', options: [{ id: 'a', text: 'Jorhat' }, { id: 'b', text: 'Guwahati' }, { id: 'c', text: 'Silchar' }, { id: 'd', text: 'Tezpur' }], correct: 'a', explanation: 'AAU is premier agricultural institution located in Borbheta, Jorhat.' },
          { id: 'q34', text: 'Which wildlife sanctuary is located in the middle of the Brahmaputra river near Guwahati?', options: [{ id: 'a', text: 'Umananda Wildlife Sanctuary' }, { id: 'b', text: 'Orang National Park' }, { id: 'c', text: 'Laokhowa' }, { id: 'd', text: 'Burachapori' }], correct: 'a', explanation: 'Umananda is the smallest inhabited river island sanctuary on Peacock Island.' },
          { id: 'q35', text: 'Who was the founder of the Koch dynasty in Kamrup?', options: [{ id: 'a', text: 'Biswa Singha' }, { id: 'b', text: 'Naranarayan' }, { id: 'c', text: 'Chilarai' }, { id: 'd', text: 'Malladev' }], correct: 'a', explanation: 'Biswa Singha founded the Koch kingdom in the early 16th century.' },
          { id: 'q36', text: 'The Barak Valley in southern Assam comprises how many districts?', options: [{ id: 'a', text: '3 (Cachar, Karimganj, Hailakandi)' }, { id: 'b', text: '4' }, { id: 'c', text: '2' }, { id: 'd', text: '5' }], correct: 'a', explanation: 'Barak Valley consists of Cachar, Karimganj, and Hailakandi districts.' },
          { id: 'q37', text: 'Which Assamese sportsperson won a medal at the Commonwealth Games?', options: [{ id: 'a', text: 'Lovlina Borgohain' }, { id: 'b', text: 'Hima Das' }, { id: 'c', text: 'Shiva Thapa' }, { id: 'd', text: 'Nayan Moni Saikia' }], correct: 'd', explanation: 'Nayan Moni Saikia won gold in lawn bowls at the 2022 Commonwealth Games.' },
          { id: 'q38', text: 'When was Majuli officially declared as a full-fledged district?', options: [{ id: 'a', text: '2016' }, { id: 'b', text: '2005' }, { id: 'c', text: '2010' }, { id: 'd', text: '2020' }], correct: 'a', explanation: 'Majuli became India’s first river island district in 2016.' },
          { id: 'q39', text: 'What is the primary mineral resource extracted in Upper Assam oilfields?', options: [{ id: 'a', text: 'Crude Petroleum and Natural Gas' }, { id: 'b', text: 'Coal only' }, { id: 'c', text: 'Iron ore' }, { id: 'd', text: 'Limestone' }], correct: 'a', explanation: 'Digboi and surrounding fields are famous for crude oil and natural gas reserves.' },
          { id: 'q40', text: 'Who wrote the book "Asom Buranji"?', options: [{ id: 'a', text: 'Gunabhiram Barua' }, { id: 'b', text: 'S.K. Bhuyan' }, { id: 'c', text: 'Hemchandra Barua' }, { id: 'd', text: 'Benudhar Sharma' }], correct: 'b', explanation: 'Dr. S.K. Bhuyan is renowned for his extensive historical works including Asom Buranji.' },
          { id: 'q41', text: 'Which is the highest civilian award conferred by the Government of Assam?', options: [{ id: 'a', text: 'Asom Ratna' }, { id: 'b', text: 'Assam Vibhushan' }, { id: 'c', text: 'Bishnu Rabha Award' }, { id: 'd', text: 'Sankardev Award' }], correct: 'a', explanation: 'Asom Ratna is the highest civilian state honor in Assam.' },
          { id: 'q42', text: 'The headquarters of Oil India Limited (OIL) is situated at:', options: [{ id: 'a', text: 'Duliajan' }, { id: 'b', text: 'Digboi' }, { id: 'c', text: 'Guwahati' }, { id: 'd', text: 'Numaligarh' }], correct: 'a', explanation: 'OIL headquarters is located in Duliajan, Dibrugarh district.' },
          { id: 'q43', text: 'Which traditional festival is celebrated to mark the Assamese New Year in mid-April?', options: [{ id: 'a', text: 'Rongali Bihu (Bohag Bihu)' }, { id: 'b', text: 'Magh Bihu' }, { id: 'c', text: 'Kati Bihu' }, { id: 'd', text: 'Ali Ai Ligang' }], correct: 'a', explanation: 'Bohag Bihu or Rongali Bihu marks the onset of the agricultural season and Assamese New Year.' },
          { id: 'q44', text: 'Where was the first tea estate in Assam established in 1837?', options: [{ id: 'a', text: ' Chabua' }, { id: 'b', text: 'Jorhat' }, { id: 'c', text: 'Dibrugarh' }, { id: 'd', text: 'Nazira' }], correct: 'a', explanation: 'Chabua in Upper Assam was the site of the first commercial tea plantation.' },
          { id: 'q45', text: 'Who designed the distinctive Assamese Gamocha?', options: [{ id: 'a', text: 'Traditional indigenous weavers' }, { id: 'b', text: 'Ahom kings' }, { id: 'c', text: 'British administrators' }, { id: 'd', text: 'Vaishnavite saints' }], correct: 'a', explanation: 'The Gamocha is an age-old symbol of Assamese cultural identity crafted by local weavers.' },
          { id: 'q46', text: 'The Pobitora Wildlife Sanctuary is especially famous for having:', options: [{ id: 'a', text: 'Highest density of One-horned Rhinoceros' }, { id: 'b', text: 'Wild buffaloes only' }, { id: 'c', text: 'Migratory swans' }, { id: 'd', text: 'Snow leopards' }], correct: 'a', explanation: 'Pobitora boasts the highest concentration/density of rhinoceros per square kilometer in the world.' },
          { id: 'q47', text: 'Which river separates the districts of Kamrup and Darrang?', options: [{ id: 'a', text: 'Brahmaputra' }, { id: 'b', text: 'Puthimari' }, { id: 'c', text: 'Barnadi' }, { id: 'd', text: 'Manas' }], correct: 'a', explanation: 'The mighty Brahmaputra river forms the boundary line between Kamrup and Darrang.' },
          { id: 'q48', text: 'Who was the first translator of the Ramayana into Assamese poetry?', options: [{ id: 'a', text: 'Madhav Kandali' }, { id: 'b', text: 'Ananta Kandali' }, { id: 'c', text: 'Sankardev' }, { id: 'd', text: 'Ram Saraswati' }], correct: 'a', explanation: 'Madhav Kandali translated the Saptakanda Ramayana into Assamese during the 14th century.' },
          { id: 'q49', text: 'Which institution in Assam is a premier central university established in Tezpur?', options: [{ id: 'a', text: 'Tezpur University' }, { id: 'b', text: 'Assam University' }, { id: 'c', text: 'Dibrugarh University' }, { id: 'd', text: 'Gauhati University' }], correct: 'a', explanation: 'Tezpur University is a central university established by an Act of Parliament in 1994.' },
          { id: 'q50', text: 'What is the total number of districts in the state of Assam as of recent reorganization?', options: [{ id: 'a', text: '35' }, { id: 'b', text: '33' }, { id: 'c', text: '27' }, { id: 'd', text: '34' }], correct: 'a', explanation: 'Assam currently comprises 35 administrative districts following recent reorganizations.' },
          { id: 'q51', text: 'Which is the largest district of Assam by area?', options: [{ id: 'a', text: 'Karbi Anglong' }, { id: 'b', text: 'Sonitpur' }, { id: 'c', text: 'Dibrugarh' }, { id: 'd', text: 'Tinsukia' }], correct: 'a', explanation: 'Karbi Anglong is the largest district in Assam by area.' },
          { id: 'q52', text: 'Which is the smallest district of Assam by area?', options: [{ id: 'a', text: 'South Salmara-Mankachar' }, { id: 'b', text: 'Majuli' }, { id: 'c', text: 'Kamrup Metro' }, { id: 'd', text: 'Chirang' }], correct: 'a', explanation: 'South Salmara-Mankachar is currently the smallest district by area.' },
          { id: 'q53', text: 'What is the state flower of Assam?', options: [{ id: 'a', text: 'Kopou Phul (Foxtail Orchid)' }, { id: 'b', text: 'Lotus' }, { id: 'c', text: 'Water Lily' }, { id: 'd', text: 'Marigold' }], correct: 'a', explanation: 'Kopou Phul or Foxtail Orchid is the state flower and an integral part of Bihu.' },
          { id: 'q54', text: 'When was the first Assamese film "Joymoti" released?', options: [{ id: 'a', text: '1935' }, { id: 'b', text: '1932' }, { id: 'c', text: '1940' }, { id: 'd', text: '1947' }], correct: 'a', explanation: 'Joymoti, directed by Jyoti Prasad Agarwala, was released in 1935.' },
          { id: 'q55', text: 'Which was the first Assamese color film?', options: [{ id: 'a', text: 'Bhaity' }, { id: 'b', text: 'Piyoli Phukan' }, { id: 'c', text: 'Joymoti' }, { id: 'd', text: 'Siraj' }], correct: 'a', explanation: 'Bhaity, directed by Kamal Narayan Choudhury and released in 1972, was the first color film.' },
          { id: 'q56', text: 'Which is the first medical college established in Assam?', options: [{ id: 'a', text: 'Assam Medical College, Dibrugarh' }, { id: 'b', text: 'Gauhati Medical College' }, { id: 'c', text: 'Silchar Medical College' }, { id: 'd', text: 'Jorhat Medical College' }], correct: 'a', explanation: 'Assam Medical College in Dibrugarh was established in 1947.' },
          { id: 'q57', text: 'How many National Parks are currently there in Assam?', options: [{ id: 'a', text: '7' }, { id: 'b', text: '5' }, { id: 'c', text: '6' }, { id: 'd', text: '8' }], correct: 'a', explanation: 'Assam has 7 National Parks including Raimona and Dehing Patkai added recently.' },
          { id: 'q58', text: 'Which was the first Assamese magazine?', options: [{ id: 'a', text: 'Orunodoi' }, { id: 'b', text: 'Jonaki' }, { id: 'c', text: 'Bahi' }, { id: 'd', text: 'Awahon' }], correct: 'a', explanation: 'Orunodoi was the first Assamese magazine published in 1846 from Sivasagar.' },
          { id: 'q59', text: 'Who was the first editor of Orunodoi?', options: [{ id: 'a', text: 'Dr. Nathan Brown' }, { id: 'b', text: 'Miles Bronson' }, { id: 'c', text: 'Anandaram Dhekial Phukan' }, { id: 'd', text: 'Hemchandra Barua' }], correct: 'a', explanation: 'Dr. Nathan Brown, an American Baptist missionary, was the first editor.' },
          { id: 'q60', text: 'Kaziranga was upgraded to a Tiger Reserve in which year?', options: [{ id: 'a', text: '2006' }, { id: 'b', text: '1974' }, { id: 'c', text: '1985' }, { id: 'd', text: '2010' }], correct: 'a', explanation: 'Kaziranga was declared a Tiger Reserve in 2006 due to its high tiger density.' },
          { id: 'q61', text: 'Which is the highest peak of the Karbi plateau?', options: [{ id: 'a', text: 'Singhason' }, { id: 'b', text: 'Dambuk' }, { id: 'c', text: 'Chenghehishon' }, { id: 'd', text: 'Khasi hill' }], correct: 'a', explanation: 'Singhason is the highest peak in the Karbi Anglong plateau.' },
          { id: 'q62', text: 'Who is known as the "Father of Assamese Literature"?', options: [{ id: 'a', text: 'Srimanta Sankardev' }, { id: 'b', text: 'Madhavdev' }, { id: 'c', text: 'Bhattadeva' }, { id: 'd', text: 'Hem Saraswati' }], correct: 'a', explanation: 'Srimanta Sankardev is revered as the father of Assamese culture and literature.' },
          { id: 'q63', text: 'Who was the first Assamese to win the Jnanpith Award?', options: [{ id: 'a', text: 'Birendra Kumar Bhattacharya' }, { id: 'b', text: 'Mamoni Raisom Goswami' }, { id: 'c', text: 'Nilmani Phookan' }, { id: 'd', text: 'Hiren Bhattacharya' }], correct: 'a', explanation: 'Birendra Kumar Bhattacharya won it in 1979 for his novel "Mrityunjay".' },
          { id: 'q64', text: 'Hajo is a prominent confluence of which three religions?', options: [{ id: 'a', text: 'Hinduism, Islam, Buddhism' }, { id: 'b', text: 'Hinduism, Islam, Christianity' }, { id: 'c', text: 'Hinduism, Sikhism, Jainism' }, { id: 'd', text: 'Hinduism, Buddhism, Jainism' }], correct: 'a', explanation: 'Hajo is famous for Hayagriva Madhava Temple (Hindu/Buddhist) and Powa Mecca (Islam).' },
          { id: 'q65', text: 'Umananda Temple is situated on which hill?', options: [{ id: 'a', text: 'Bhasmacala' }, { id: 'b', text: 'Nilachal' }, { id: 'c', text: 'Chitrachal' }, { id: 'd', text: 'Monikarneswar' }], correct: 'a', explanation: 'Umananda temple is located on the Bhasmacala hill (Peacock Island).' },
          { id: 'q66', text: 'Which town is known as the "Manchester of Assam"?', options: [{ id: 'a', text: 'Sualkuchi' }, { id: 'b', text: 'Hajo' }, { id: 'c', text: 'Digboi' }, { id: 'd', text: 'Tezpur' }], correct: 'a', explanation: 'Sualkuchi is famous for its massive silk weaving industry.' },
          { id: 'q67', text: 'Who is credited with discovering tea in Assam in 1823?', options: [{ id: 'a', text: 'Robert Bruce' }, { id: 'b', text: 'Charles Bruce' }, { id: 'c', text: 'Maniram Dewan' }, { id: 'd', text: 'David Scott' }], correct: 'a', explanation: 'Scottish adventurer Robert Bruce discovered indigenous tea plants in Assam in 1823.' },
          { id: 'q68', text: 'What is the length of the Bhupen Hazarika Setu (Dhola-Sadiya Bridge)?', options: [{ id: 'a', text: '9.15 km' }, { id: 'b', text: '4.94 km' }, { id: 'c', text: '7.5 km' }, { id: 'd', text: '10.2 km' }], correct: 'a', explanation: 'It is the longest bridge over water in India, measuring 9.15 kilometers.' },
          { id: 'q69', text: 'Raimona National Park is located in which district?', options: [{ id: 'a', text: 'Kokrajhar' }, { id: 'b', text: 'Chirang' }, { id: 'c', text: 'Baksa' }, { id: 'd', text: 'Bongaigaon' }], correct: 'a', explanation: 'Raimona National Park, notified in 2021, is situated in Kokrajhar district (BTR).' },
          { id: 'q70', text: 'Total Lok Sabha constituencies in Assam?', options: [{ id: 'a', text: '14' }, { id: 'b', text: '12' }, { id: 'c', text: '16' }, { id: 'd', text: '7' }], correct: 'a', explanation: 'Assam sends 14 representatives to the Lok Sabha.' },
          { id: 'q71', text: 'Who was the first Chief Justice of the Gauhati High Court?', options: [{ id: 'a', text: 'Sir R.F. Lodge' }, { id: 'b', text: 'Justice Holiram Deka' }, { id: 'c', text: 'Justice Parbati Kumar Goswami' }, { id: 'd', text: 'Justice M.C. Pathak' }], correct: 'a', explanation: 'Sir R.F. Lodge served as the first Chief Justice when it was established in 1948.' },
          { id: 'q72', text: 'Who was the first Assamese woman to win the Sahitya Akademi Award?', options: [{ id: 'a', text: 'Nalinibala Devi' }, { id: 'b', text: 'Indira Goswami' }, { id: 'c', text: 'Anuradha Sharma Pujari' }, { id: 'd', text: 'Rita Chowdhury' }], correct: 'a', explanation: 'Nalinibala Devi won it for her poetry collection "Alakananda" in 1968.' },
          { id: 'q73', text: 'Which festival is widely celebrated as the festival of colors in Barpeta Satra?', options: [{ id: 'a', text: 'Doul Utsav' }, { id: 'b', text: 'Bihu' }, { id: 'c', text: 'Ali-Ai-Ligang' }, { id: 'd', text: 'Me-Dam-Me-Phi' }], correct: 'a', explanation: 'Doul Utsav (Holi) is celebrated with great fervor at the Barpeta Satra.' },
          { id: 'q74', text: 'What is the literacy rate of Assam as per the 2011 Census?', options: [{ id: 'a', text: '72.19%' }, { id: 'b', text: '74.04%' }, { id: 'c', text: '69.10%' }, { id: 'd', text: '78.50%' }], correct: 'a', explanation: 'The literacy rate of Assam according to the 2011 census is 72.19%.' },
          { id: 'q75', text: 'Which is the most populous district in Assam (2011 Census)?', options: [{ id: 'a', text: 'Nagaon' }, { id: 'b', text: 'Dhubri' }, { id: 'c', text: 'Kamrup Metro' }, { id: 'd', text: 'Cachar' }], correct: 'a', explanation: 'Nagaon is the most populous district in Assam.' },
          { id: 'q76', text: 'Assam shares international boundaries with which two countries?', options: [{ id: 'a', text: 'Bhutan and Bangladesh' }, { id: 'b', text: 'Bhutan and Myanmar' }, { id: 'c', text: 'Nepal and Bangladesh' }, { id: 'd', text: 'China and Myanmar' }], correct: 'a', explanation: 'Assam shares international borders with Bhutan in the north and Bangladesh in the south.' },
          { id: 'q77', text: 'With how many Indian states does Assam share its boundary?', options: [{ id: 'a', text: '7' }, { id: 'b', text: '6' }, { id: 'c', text: '8' }, { id: 'd', text: '5' }], correct: 'a', explanation: 'Assam shares borders with 7 states: Arunachal, Nagaland, Manipur, Mizoram, Tripura, Meghalaya, West Bengal.' },
          { id: 'q78', text: 'Which was the first Assamese daily newspaper?', options: [{ id: 'a', text: 'Dainik Batori' }, { id: 'b', text: 'Asomiya Pratidin' }, { id: 'c', text: 'Dainik Asam' }, { id: 'd', text: 'Agradoot' }], correct: 'a', explanation: 'Dainik Batori, published from Jorhat in 1935, was the first daily newspaper.' },
          { id: 'q79', text: 'When was the Digboi oil refinery established?', options: [{ id: 'a', text: '1901' }, { id: 'b', text: '1889' }, { id: 'c', text: '1921' }, { id: 'd', text: '1955' }], correct: 'a', explanation: 'Digboi Refinery, the oldest operating refinery in Asia, was established in 1901.' },
          { id: 'q80', text: 'How many operational oil refineries are there in Assam?', options: [{ id: 'a', text: '4' }, { id: 'b', text: '3' }, { id: 'c', text: '5' }, { id: 'd', text: '2' }], correct: 'a', explanation: 'Assam has 4 refineries: Digboi, Guwahati (Noonmati), Bongaigaon, and Numaligarh.' },
          { id: 'q81', text: 'Who is known as the "Sudhakantha" of Assam?', options: [{ id: 'a', text: 'Bhupen Hazarika' }, { id: 'b', text: 'Jyoti Prasad Agarwala' }, { id: 'c', text: 'Bishnu Prasad Rabha' }, { id: 'd', text: 'Ananda Chandra Barua' }], correct: 'a', explanation: 'Dr. Bhupen Hazarika is fondly remembered as Sudhakantha.' },
          { id: 'q82', text: 'The Nambor Wildlife Sanctuary is located in which district?', options: [{ id: 'a', text: 'Karbi Anglong' }, { id: 'b', text: 'Golaghat' }, { id: 'c', text: 'Nagaon' }, { id: 'd', text: 'Dima Hasao' }], correct: 'a', explanation: 'Nambor Wildlife Sanctuary is known for its hot springs and is in Karbi Anglong.' },
          { id: 'q83', text: 'Which Ahom king built the Umananda Temple?', options: [{ id: 'a', text: 'Gadadhar Singha' }, { id: 'b', text: 'Rudra Singha' }, { id: 'c', text: 'Siva Singha' }, { id: 'd', text: 'Pramatta Singha' }], correct: 'a', explanation: 'King Gadadhar Singha commissioned the Umananda Temple in 1694.' },
          { id: 'q84', text: 'The "Me-Dam-Me-Phi" festival is celebrated by which community?', options: [{ id: 'a', text: 'Ahom' }, { id: 'b', text: 'Bodo' }, { id: 'c', text: 'Mising' }, { id: 'd', text: 'Rabha' }], correct: 'a', explanation: 'It is a traditional ancestor-worship festival of the Tai-Ahom community.' },
          { id: 'q85', text: 'Who was the founder of the Asam Sahitya Sabha in 1917?', options: [{ id: 'a', text: 'Padmanath Gohain Baruah' }, { id: 'b', text: 'Lakshminath Bezbaroa' }, { id: 'c', text: 'Hemchandra Goswami' }, { id: 'd', text: 'Chandradhar Barua' }], correct: 'a', explanation: 'Padmanath Gohain Baruah was the first president and a key founder of the Asam Sahitya Sabha.' },
          { id: 'q86', text: 'Ali-Ai-Ligang is a spring festival associated with which community?', options: [{ id: 'a', text: 'Mising' }, { id: 'b', text: 'Bodo' }, { id: 'c', text: 'Tiwa' }, { id: 'd', text: 'Dimasa' }], correct: 'a', explanation: 'Ali-Ai-Ligang is an agriculture-based spring festival of the Mising tribe.' },
          { id: 'q87', text: 'Which place in Assam is famous for its cement factory set up by CCI?', options: [{ id: 'a', text: 'Bokajan' }, { id: 'b', text: 'Jagiroad' }, { id: 'c', text: 'Namrup' }, { id: 'd', text: 'Bongaigaon' }], correct: 'a', explanation: 'Bokajan in Karbi Anglong has a major plant of the Cement Corporation of India.' },
          { id: 'q88', text: 'Who is the author of "Halodhiya Choraye Baodhan Khai"?', options: [{ id: 'a', text: 'Homen Borgohain' }, { id: 'b', text: 'Bhabendra Nath Saikia' }, { id: 'c', text: 'Navakanta Barua' }, { id: 'd', text: 'Syed Abdul Malik' }], correct: 'a', explanation: 'The novel, later made into an award-winning film, was written by Homen Borgohain.' },
          { id: 'q89', text: 'Which article of the Indian Constitution gives special provisions to Assam?', options: [{ id: 'a', text: '371B' }, { id: 'b', text: '371A' }, { id: 'c', text: '371C' }, { id: 'd', text: '370' }], correct: 'a', explanation: 'Article 371B provides special provisions regarding the Assam Legislative Assembly.' },
          { id: 'q90', text: 'What is the traditional name of the roof of a Namghar?', options: [{ id: 'a', text: 'Tup' }, { id: 'b', text: 'Kareng' }, { id: 'c', text: 'Manikut' }, { id: 'd', text: 'Batadrava' }], correct: 'a', explanation: 'The curved, dome-like roof at the end of a traditional Namghar is called a Tup.' },
          { id: 'q91', text: 'The "Deodhani" dance is associated with the worship of which deity?', options: [{ id: 'a', text: 'Goddess Manasa' }, { id: 'b', text: 'Lord Shiva' }, { id: 'c', text: 'Lord Vishnu' }, { id: 'd', text: 'Goddess Kamakhya' }], correct: 'a', explanation: 'Deodhani dance is a shamanistic folk dance linked to the worship of snake goddess Manasa.' },
          { id: 'q92', text: 'Which city in Assam is called the "City of Eternal Romance"?', options: [{ id: 'a', text: 'Tezpur' }, { id: 'b', text: 'Guwahati' }, { id: 'c', text: 'Jorhat' }, { id: 'd', text: 'Sivasagar' }], correct: 'a', explanation: 'Tezpur is known as the City of Love/Romance due to the legend of Usha and Aniruddha.' },
          { id: 'q93', text: 'Who was the first woman minister in the Assam Cabinet?', options: [{ id: 'a', text: 'Usha Borthakur' }, { id: 'b', text: 'Syeda Anwara Taimur' }, { id: 'c', text: 'Pramila Rani Brahma' }, { id: 'd', text: 'Ajanta Neog' }], correct: 'b', explanation: 'Syeda Anwara Taimur was the first female minister and later the first female Chief Minister.' },
          { id: 'q94', text: 'Total number of Sub-divisions in Assam is approximately?', options: [{ id: 'a', text: '78' }, { id: 'b', text: '54' }, { id: 'c', text: '65' }, { id: 'd', text: '85' }], correct: 'a', explanation: 'Assam currently has around 78 civil sub-divisions (number fluctuates with reorganization).' },
          { id: 'q95', text: 'Boko, famous for its sericulture research, is in which district?', options: [{ id: 'a', text: 'Kamrup' }, { id: 'b', text: 'Goalpara' }, { id: 'c', text: 'Nalbari' }, { id: 'd', text: 'Barpeta' }], correct: 'a', explanation: 'Boko is situated in the Kamrup rural district.' },
          { id: 'q96', text: 'What is the full form of NRC?', options: [{ id: 'a', text: 'National Register of Citizens' }, { id: 'b', text: 'National Record of Civilians' }, { id: 'c', text: 'New Register of Citizens' }, { id: 'd', text: 'National Roll of Citizens' }], correct: 'a', explanation: 'NRC stands for the National Register of Citizens, heavily discussed in Assam.' },
          { id: 'q97', text: 'The Rupsi Airport is located in which district?', options: [{ id: 'a', text: 'Dhubri' }, { id: 'b', text: 'Kokrajhar' }, { id: 'c', text: 'Bongaigaon' }, { id: 'd', text: 'Goalpara' }], correct: 'a', explanation: 'Rupsi Airport is a historic WWII-era airport located in Dhubri district.' },
          { id: 'q98', text: 'Which is the largest wet land (Beel) in Assam?', options: [{ id: 'a', text: 'Son Beel' }, { id: 'b', text: 'Deepor Beel' }, { id: 'c', text: 'Urpad Beel' }, { id: 'd', text: 'Maguri Beel' }], correct: 'a', explanation: 'Son Beel in Karimganj district is the largest lake/wetland in Assam.' },
          { id: 'q99', text: 'Which bridge connects Goalpara and Bongaigaon?', options: [{ id: 'a', text: 'Naranarayan Setu' }, { id: 'b', text: 'Saraighat' }, { id: 'c', text: 'Kolia Bhomora' }, { id: 'd', text: 'Bogibeel' }], correct: 'a', explanation: 'Naranarayan Setu connects Pancharatna (Goalpara) and Jogighopa (Bongaigaon).' },
          { id: 'q100', text: 'Assam State Museum is located in?', options: [{ id: 'a', text: 'Guwahati' }, { id: 'b', text: 'Tezpur' }, { id: 'c', text: 'Sivasagar' }, { id: 'd', text: 'Jorhat' }], correct: 'a', explanation: 'The Assam State Museum is situated at Dighalipukhuri, Guwahati.' }
        ]
      },
      police: {
        id: 'police',
        title: 'Assam Police Constable/SI',
        icon: 'shield',
        color: 'green',
        questions: [
          { id: 'q1', text: 'Assam Police Day is observed annually on which date?', options: [{ id: 'a', text: '1st January' }, { id: 'b', text: '15th August' }, { id: 'c', text: '1st October' }, { id: 'd', text: '14th November' }], correct: 'c', explanation: 'Assam Police Day is celebrated on October 1st to honor the force\'s foundation.' },
          { id: 'q2', text: 'Where is the main Headquarters of the Assam Police situated?', options: [{ id: 'a', text: 'Dispur, Guwahati' }, { id: 'b', text: 'Ulubari, Guwahati' }, { id: 'c', text: 'Dergaon, Golaghat' }, { id: 'd', text: 'Panbazar, Guwahati' }], correct: 'b', explanation: 'The Assam Police headquarters is located in Ulubari, Guwahati.' },
          { id: 'q3', text: 'What is the official motto of the Assam Police?', options: [{ id: 'a', text: 'Satyameva Jayate' }, { id: 'b', text: 'Janahit Janasevarthe' }, { id: 'c', text: 'Service and Loyalty' }, { id: 'd', text: 'Protection and Courage' }], correct: 'b', explanation: '"Janahit Janasevarthe" translates to "For the welfare of the people, for the service of the people".' },
          { id: 'q4', text: 'The premier Police Training College (PTC) of Assam is located at:', options: [{ id: 'a', text: 'Kahilipara' }, { id: 'b', text: 'Dergaon' }, { id: 'c', text: 'Lanka' }, { id: 'd', text: 'Rangia' }], correct: 'b', explanation: 'Dergaon houses the premier training academy for Assam Police personnel.' },
          { id: 'q5', text: 'Which section under the IPC/BNS deals with punishment for murder?', options: [{ id: 'a', text: 'Section 302' }, { id: 'b', text: 'Section 304' }, { id: 'c', text: 'Section 307' }, { id: 'd', text: 'Section 376' }], correct: 'a', explanation: 'Section 302 of the IPC prescribes capital punishment or life imprisonment for murder.' },
          { id: 'q6', text: 'What does the acronym FIR stand for in criminal procedure?', options: [{ id: 'a', text: 'First Investigation Report' }, { id: 'b', text: 'First Information Report' }, { id: 'c', text: 'Formal Incident Record' }, { id: 'd', text: 'Fast Inquiry Register' }], correct: 'b', explanation: 'FIR stands for First Information Report, registered by police upon receiving information about a cognizable crime.' },
          { id: 'q7', text: 'The Village Defence Organisation (VDO) / VDP in Assam was legally constituted under which act?', options: [{ id: 'a', text: 'Assam VDP Act, 1966' }, { id: 'b', text: 'Police Act, 1861' }, { id: 'c', text: 'Assam Panchayat Act' }, { id: 'd', text: 'Criminal Procedure Code' }], correct: 'a', explanation: 'The Assam Village Defence Organisation Act of 1966 governs the VDP system.' },
          { id: 'q8', text: 'Who is the administrative head of the police force in the State of Assam?', options: [{ id: 'a', text: 'Home Minister' }, { id: 'b', text: 'Director General of Police (DGP)' }, { id: 'c', text: 'Inspector General of Police' }, { id: 'd', text: 'Chief Secretary' }], correct: 'b', explanation: 'The DGP heads the state police department.' },
          { id: 'q9', text: 'Which unit of the Assam Police deals specifically with counter-insurgency operations?', options: [{ id: 'a', text: 'Traffic Branch' }, { id: 'b', text: 'Assam Commando Battalion / Task Force' }, { id: 'c', text: 'CID' }, { id: 'd', text: 'River Police' }], correct: 'b', explanation: 'Specialized Commando and APBn units handle specialized counter-insurgency and tactical duties.' },
          { id: 'q10', text: 'The Bureau of Investigation (Economic Offences) in Assam operates under:', options: [{ id: 'a', text: 'High Court' }, { id: 'b', text: 'Assam Police Directorate' }, { id: 'c', text: 'Reserve Bank of India' }, { id: 'd', text: 'Central Vigilance Commission' }], correct: 'b', explanation: 'It is a specialized wing functioning directly under the administrative control of Assam Police.' },
          { id: 'q11', text: 'Under which section of CrPC can a police officer arrest without a warrant for a cognizable offense?', options: [{ id: 'a', text: 'Section 41' }, { id: 'b', text: 'Section 107' }, { id: 'c', text: 'Section 144' }, { id: 'd', text: 'Section 151' }], correct: 'a', explanation: 'Section 41 CrPC outlines when police may arrest without warrant.' },
          { id: 'q12', text: 'What is the minimum physical height standard generally required for male candidates in Assam Police Constable recruitment?', options: [{ id: 'a', text: '162.56 cm' }, { id: 'b', text: '160 cm' }, { id: 'c', text: '165 cm' }, { id: 'd', text: '170 cm' }], correct: 'a', explanation: 'Standard height criteria for general male candidates in Assam Police is 162.56 cm.' },
          { id: 'q13', text: 'The Crime Investigation Department (CID) headquarters of Assam is located in:', options: [{ id: 'a', text: 'Ulubari, Guwahati' }, { id: 'b', text: 'Chandmari' }, { id: 'c', text: 'Panbazar' }, { id: 'd', text: 'Dispur' }], correct: 'a', explanation: 'CID headquarters operates out of Ulubari, Guwahati.' },
          { id: 'q14', text: 'What is the full form of AAPL in Assam Police context?', options: [{ id: 'a', text: 'Assam Armed Police Limited / Battalion' }, { id: 'b', text: 'Assam Association of Police Logistics' }, { id: 'c', text: 'All Assam Police League' }, { id: 'd', text: 'Armed Auxiliary Police Line' }], correct: 'a', explanation: 'APBn stands for Assam Police Battalion.' },
          { id: 'q15', text: 'Which section deals with causing death by negligence under IPC?', options: [{ id: 'a', text: 'Section 304A' }, { id: 'b', text: 'Section 304' }, { id: 'c', text: 'Section 279' }, { id: 'd', text: 'Section 338' }], correct: 'a', explanation: 'Section 304A penalizes causing death by negligence.' },
          { id: 'q16', text: 'Which year marked the enactment of the Police Act that governs Indian police forces generally?', options: [{ id: 'a', text: '1861' }, { id: 'b', text: '1902' }, { id: 'c', text: '1947' }, { id: 'd', text: '1950' }], correct: 'a', explanation: 'The Police Act of 1861 is the foundational legislation for police organization in India.' },
          { id: 'q17', text: 'The State Forensic Science Laboratory (FSL) in Assam is situated at:', options: [{ id: 'a', text: 'Kahilipara, Guwahati' }, { id: 'b', text: 'Maligaon' }, { id: 'c', text: 'Basistha' }, { id: 'd', text: 'Jalukbari' }], correct: 'a', explanation: 'FSL Assam is located in Kahilipara.' },
          { id: 'q18', text: 'Who heads a district police force as the Superintendent of Police (SP)?', options: [{ id: 'a', text: 'An IPS or APS officer' }, { id: 'b', text: 'District Commissioner' }, { id: 'c', text: 'Sessions Judge' }, { id: 'd', text: 'Circle Officer' }], correct: 'a', explanation: 'An IPS or senior APS officer serves as the SP of a district.' },
          { id: 'q19', text: 'What is the primary objective of the Assam Police "MEET" or community outreach programs?', options: [{ id: 'a', text: 'Bridging gap between police and public' }, { id: 'b', text: 'Tax collection' }, { id: 'c', text: 'Traffic management only' }, { id: 'd', text: 'Border fencing' }], correct: 'a', explanation: 'Community policing aims to build trust and cooperation between citizens and law enforcement.' },
          { id: 'q20', text: 'Which section of the IPC deals with rioting?', options: [{ id: 'a', text: 'Section 146 / 147' }, { id: 'b', text: 'Section 120B' }, { id: 'c', text: 'Section 34' }, { id: 'd', text: 'Section 420' }], correct: 'a', explanation: 'Sections 146 and 147 define and punish rioting.' },
          { id: 'q21', text: 'What is the tenure or retirement age for Assam Police personnel generally?', options: [{ id: 'a', text: '60 years' }, { id: 'b', text: '58 years' }, { id: 'c', text: '62 years' }, { id: 'd', text: '55 years' }], correct: 'a', explanation: 'Standard state government service retirement age in Assam is 60 years.' },
          { id: 'q22', text: 'Which special unit guards vital installations and oil refineries in Assam?', options: [{ id: 'a', text: 'Assam Industrial Security Force (AISF) / CISF' }, { id: 'b', text: 'Traffic Police' }, { id: 'c', text: 'Home Guards' }, { id: 'd', text: 'VDP' }], correct: 'a', explanation: 'Industrial security units and Central forces protect vital installations.' },
          { id: 'q23', text: 'What does a dying declaration recorded by a magistrate hold in trial?', options: [{ id: 'a', text: 'High evidentiary value' }, { id: 'b', text: 'Inadmissible' }, { id: 'c', text: 'Secondary evidence' }, { id: 'd', text: 'Requires corroboration always' }], correct: 'a', explanation: 'A dying declaration under Section 32 of Evidence Act holds substantial weight.' },
          { id: 'q24', text: 'The Assam Police Radio Organization (APRO) is responsible for:', options: [{ id: 'a', text: 'Internal telecommunication and wireless network' }, { id: 'b', text: 'Broadcasting radio news' }, { id: 'c', text: 'Cyber hacking investigation' }, { id: 'd', text: 'Traffic signals' }], correct: 'a', explanation: 'APRO provides secure police telecommunications across Assam.' },
          { id: 'q25', text: 'What is the punishment under Section 376 IPC for rape?', options: [{ id: 'a', text: 'Rigorous imprisonment not less than 10 years up to life' }, { id: 'b', text: 'Fine only' }, { id: 'c', text: '3 years imprisonment' }, { id: 'd', text: 'Community service' }], correct: 'a', explanation: 'Rape carries stringent prison terms under criminal law.' },
          { id: 'q26', text: 'Where is the 4th Assam Police Battalion (APBn) headquarters located?', options: [{ id: 'a', text: 'Kahilipara, Guwahati' }, { id: 'b', text: 'Dergaon' }, { id: 'c', text: 'Abhayapuri' }, { id: 'd', text: 'Mergherita' }], correct: 'a', explanation: 'The 4th APBn is stationed in Kahilipara.' },
          { id: 'q27', text: 'Which rank is immediately senior to a Constable in Assam Police?', options: [{ id: 'a', text: 'Lance Naik / Head Constable' }, { id: 'b', text: 'Sub-Inspector' }, { id: 'c', text: 'Inspector' }, { id: 'd', text: 'DSP' }], correct: 'a', explanation: 'Lance Naik and Head Constable are immediate promotional rungs above a Constable.' },
          { id: 'q28', text: 'What is the role of the Home Guards in Assam?', options: [{ id: 'a', text: 'Voluntary auxiliary force assisting police in internal security and emergencies' }, { id: 'b', text: 'Standing army' }, { id: 'c', text: 'Revenue collectors' }, { id: 'd', text: 'Fire brigade only' }], correct: 'a', explanation: 'Home guards assist police during elections, disasters, and traffic duties.' },
          { id: 'q29', text: 'Which division investigates cyber crimes in Assam Police?', options: [{ id: 'a', text: 'Cyber Crime Police Station / CID Cell' }, { id: 'b', text: 'Traffic Branch' }, { id: 'c', text: 'Special Branch' }, { id: 'd', text: 'Border Police' }], correct: 'a', explanation: 'Specialized cyber cells handle digital and internet-based offenses.' },
          { id: 'q30', text: 'What is the full form of STF in Assam Police?', options: [{ id: 'a', text: 'Special Task Force' }, { id: 'b', text: 'State Transport Force' }, { id: 'c', text: 'Strategic Tactical Function' }, { id: 'd', text: 'Security & Traffic Front' }], correct: 'a', explanation: 'Special Task Force (STF) handles high-risk operations and organized crime.' },
          { id: 'q31', text: 'Under what circumstances can police open fire in self-defense or dispersal of violent mobs?', options: [{ id: 'a', text: 'As a last resort when life/property is gravely endangered following due procedure' }, { id: 'b', text: 'At any time without warning' }, { id: 'c', text: 'Only on written orders of Governor' }, { id: 'd', text: 'Never permitted' }], correct: 'a', explanation: 'Use of force must be proportional and strictly lawful as a last resort.' },
          { id: 'q32', text: 'What is a chargesheet filed under Section 173 CrPC called?',     options: [{ id: 'a', text: 'Police Report' }, { id: 'b', text: 'Final Summons' }, { id: 'c', text: 'Warrant petition' }, { id: 'd', text: 'Bail application' }], correct: 'a', explanation: 'The final report submitted by police after investigation is termed the police report / chargesheet.' },
          { id: 'q33', text: 'Which wing of Assam Police monitors foreigners and infiltration issues?', options: [{ id: 'a', text: 'Assam Border Police Organization' }, { id: 'b', text: 'River Police' }, { id: 'c', text: 'Railway Police' }, { id: 'd', text: 'Traffic Police' }], correct: 'a', explanation: 'Border Police works to detect and check illegal immigration.' },
          { id: 'q34', text: 'What is the primary function of the Special Branch (SB) of Assam Police?', options: [{ id: 'a', text: 'Intelligence gathering and security assessment' }, { id: 'b', text: 'Traffic control' }, { id: 'c', text: 'Filing chargesheets in courts' }, { id: 'd', text: 'Jail administration' }], correct: 'a', explanation: 'Special Branch is the intelligence wing of the state police.' },
          { id: 'q35', text: 'What does Section 144 of CrPC empower authorities to do?', options: [{ id: 'a', text: 'Prohibit assembly of 4 or more persons in apprehended danger' }, { id: 'b', text: 'Impose curfew permanently' }, { id: 'c', text: 'Collect income tax' }, { id: 'd', text: 'Issue driving licenses' }], correct: 'a', explanation: 'Section 144 restricts unlawful assemblies to maintain public peace.' },
          { id: 'q36', text: 'The Railway Police District in Assam has headquarters at:', options: [{ id: 'a', text: 'Guwahati (Pandu)' }, { id: 'b', text: 'Dibrugarh' }, { id: 'c', text: 'Lumding' }, { id: 'd', text: 'New Tinsukia' }], correct: 'a', explanation: 'Government Railway Police (GRP) has major administrative setups in Guwahati/Pandu and Lumding.' },
          { id: 'q37', text: 'What is bail during police custody known as before formal chargesheet?', options: [{ id: 'a', text: 'Statutory / Default bail or Regular bail' }, { id: 'b', text: 'Anticipatory bail only' }, { id: 'c', text: 'Parole' }, { id: 'd', text: 'Pardon' }], correct: 'a', explanation: 'Bail provisions allow release under judicial or police discretion subject to conditions.' },
          { id: 'q38', text: 'Which official document records daily events and arrests at a police station?', options: [{ id: 'a', text: 'General Diary (GD) / Station Diary' }, { id: 'b', text: 'FIR book only' }, { id: 'c', text: 'Court ledger' }, { id: 'd', text: 'Revenue register' }], correct: 'a', explanation: 'General Diary records all crucial daily movements and occurrences at a police station.' },
          { id: 'q39', text: 'What is the role of a Public Prosecutor in a criminal trial?', options: [{ id: 'a', text: 'Represent the state / victim to bring offenders to justice' }, { id: 'b', text: 'Defend the accused' }, { id: 'c', text: 'Preside over the court' }, { id: 'd', text: 'Investigate the crime' }], correct: 'a', explanation: 'Public Prosecutors conduct prosecution on behalf of the state.' },
          { id: 'q40', text: 'Which biometric verification is increasingly used during police verification in Assam?', options: [{ id: 'a', text: 'Aadhaar and Fingerprint scanning (AFIS)' }, { id: 'b', text: 'Voice matching only' }, { id: 'c', text: 'Signature analysis' }, { id: 'd', text: 'Blood group test' }], correct: 'a', explanation: 'Automated Fingerprint Identification Systems (AFIS) are standard in modern police verification.' },
          { id: 'q41', text: 'What is the significance of the 24-hour rule after arrest under Article 22?', options: [{ id: 'a', text: 'Must be produced before nearest magistrate within 24 hours' }, { id: 'b', text: 'Must be released automatically' }, { id: 'c', text: 'Must be tried and sentenced' }, { id: 'd', text: 'Must be transferred to high court' }], correct: 'a', explanation: 'Arrested persons have the constitutional right to be produced before a magistrate within 24 hours.' },
          { id: 'q42', text: 'Which wing handles riverine patrols along the Brahmaputra in Assam?', options: [{ id: 'a', text: 'River Police / Water Wing' }, { id: 'b', text: 'Indian Navy' }, { id: 'c', text: 'Coast Guard exclusively' }, { id: 'd', text: 'Forest guards' }], correct: 'a', explanation: 'River police stations patrol the Brahmaputra waterway.' },
          { id: 'q43', text: 'What does "Cognizable Offense" mean?', options: [{ id: 'a', text: 'Police can arrest without warrant and start investigation without court order' }, { id: 'b', text: 'Only bailable crimes' }, { id: 'c', text: 'Crimes investigated only by CBI' }, { id: 'd', text: 'Civil disputes' }], correct: 'a', explanation: 'Cognizable offenses allow direct police action without prior judicial warrant.' },
          { id: 'q44', text: 'Who is the disciplinary authority for subordinate police officers in Assam?', options: [{ id: 'a', text: 'Superintendent of Police / Inspector General respective to rank' }, { id: 'b', text: 'Prime Minister' }, { id: 'c', text: 'President' }, { id: 'd', text: 'District Judge' }], correct: 'a', explanation: 'Departmental disciplinary actions are governed by service rules through SPs and senior officers.' },
          { id: 'q45', text: 'What is a transit remand in police procedure?', options: [{ id: 'a', text: 'Permission to transport an accused arrested in one state to another' }, { id: 'b', text: 'Bail during transit' }, { id: 'c', text: 'Traffic violation ticket' }, { id: 'd', text: 'Court transfer' }], correct: 'a', explanation: 'Transit remand allows moving an accused person from the place of arrest to the trial jurisdiction.' },
          { id: 'q46', text: 'The Assam Police museum is located at:', options: [{ id: 'a', text: 'Dergaon (PTC campus)' }, { id: 'b', text: 'Guwahati' }, { id: 'c', text: 'Kaziranga' }, { id: 'd', text: 'Tezpur' }], correct: 'a', explanation: 'Dergaon houses the heritage police museum showcasing Assam Police history.' },
          { id: 'q47', text: 'What does the term "Inquest" mean in police investigation?', options: [{ id: 'a', text: 'Magisterial or police inquiry into the cause of an unnatural death' }, { id: 'b', text: 'Interrogation of suspects' }, { id: 'c', text: 'Raid operation' }, { id: 'd', text: 'Traffic checking' }], correct: 'a', explanation: 'Inquest report documents apparent injuries and circumstances of unnatural deaths.' },
          { id: 'q48', text: 'Which emergency helpline number is integrated with Assam Police emergency response?', options: [{ id: 'a', text: '112' }, { id: 'b', text: '100' }, { id: 'c', text: '108' }, { id: 'd', text: '101' }], correct: 'a', explanation: '112 is the pan-India Emergency Response Support System (ERSS) operational with Assam Police.' },
          { id: 'q49', text: 'What is the role of a Beat Officer in police stations?', options: [{ id: 'a', text: 'Patrolling and intelligence collection in assigned neighborhood areas' }, { id: 'b', text: 'Desk paperwork only' }, { id: 'c', text: 'Court advocacy' }, { id: 'd', text: 'Budget planning' }], correct: 'a', explanation: 'Beat policing ensures grassroots community contact and local crime prevention.' },
          { id: 'q50', text: 'What is the primary duty of police during elections in Assam?', options: [{ id: 'a', text: 'Ensuring free, fair, and peaceful polling and security of booths' }, { id: 'b', text: 'Voting for citizens' }, { id: 'c', text: 'Counting votes directly' }, { id: 'd', text: 'Campaigning' }], correct: 'a', explanation: 'Election security ensures peaceful democratic exercises across constituencies.' },
          { id: 'q51', text: 'Who appoints the Chief Justice of India?', options: [{ id: 'a', text: 'The President' }, { id: 'b', text: 'Prime Minister' }, { id: 'c', text: 'Parliament' }, { id: 'd', text: 'Law Minister' }], correct: 'a', explanation: 'The President of India appoints the CJI under Article 124 of the Constitution.' },
          { id: 'q52', text: 'What is the minimum age to be elected as the President of India?', options: [{ id: 'a', text: '35 Years' }, { id: 'b', text: '30 Years' }, { id: 'c', text: '25 Years' }, { id: 'd', text: '40 Years' }], correct: 'a', explanation: 'Article 58 specifies 35 years as the minimum age for Presidential candidates.' },
          { id: 'q53', text: 'Which Part of the Constitution deals with Fundamental Rights?', options: [{ id: 'a', text: 'Part III' }, { id: 'b', text: 'Part II' }, { id: 'c', text: 'Part IV' }, { id: 'd', text: 'Part V' }], correct: 'a', explanation: 'Part III (Articles 12-35) enshrines Fundamental Rights.' },
          { id: 'q54', text: 'Which is the highest peacetime gallantry award in India?', options: [{ id: 'a', text: 'Ashok Chakra' }, { id: 'b', text: 'Param Vir Chakra' }, { id: 'c', text: 'Kirti Chakra' }, { id: 'd', text: 'Shaurya Chakra' }], correct: 'a', explanation: 'Ashok Chakra is awarded for valor, courageous action, or self-sacrifice away from the battlefield.' },
          { id: 'q55', text: 'Who was the first Chief of Defence Staff (CDS) of India?', options: [{ id: 'a', text: 'General Bipin Rawat' }, { id: 'b', text: 'General V.K. Singh' }, { id: 'c', text: 'Admiral Karambir Singh' }, { id: 'd', text: 'Air Chief Marshal R.K.S. Bhadauria' }], correct: 'a', explanation: 'Gen Bipin Rawat assumed the inaugural office of CDS on 1 January 2020.' },
          { id: 'q56', text: 'The Central Bureau of Investigation (CBI) operates under which Ministry?', options: [{ id: 'a', text: 'Ministry of Personnel, Public Grievances and Pensions' }, { id: 'b', text: 'Ministry of Home Affairs' }, { id: 'c', text: 'Ministry of Defence' }, { id: 'd', text: 'Ministry of Law' }], correct: 'a', explanation: 'CBI functions under the Dept of Personnel and Training (DoPT).' },
          { id: 'q57', text: 'The National Investigation Agency (NIA) was established in which year?', options: [{ id: 'a', text: '2008' }, { id: 'b', text: '2001' }, { id: 'c', text: '2014' }, { id: 'd', text: '1999' }], correct: 'a', explanation: 'NIA was formed by an Act in 2008 in the aftermath of the 26/11 Mumbai terror attacks.' },
          { id: 'q58', text: 'Where is the headquarters of INTERPOL located?', options: [{ id: 'a', text: 'Lyon, France' }, { id: 'b', text: 'Geneva, Switzerland' }, { id: 'c', text: 'New York, USA' }, { id: 'd', text: 'London, UK' }], correct: 'a', explanation: 'The International Criminal Police Organization (INTERPOL) is headquartered in Lyon.' },
          { id: 'q59', text: 'Which Central Armed Police Force primarily guards the Indo-Pak and Indo-Bangla borders?', options: [{ id: 'a', text: 'Border Security Force (BSF)' }, { id: 'b', text: 'CRPF' }, { id: 'c', text: 'ITBP' }, { id: 'd', text: 'SSB' }], correct: 'a', explanation: 'BSF is India\'s primary border guarding force for its borders with Pakistan and Bangladesh.' },
          { id: 'q60', text: 'Where is the headquarters of the Assam Rifles?', options: [{ id: 'a', text: 'Shillong' }, { id: 'b', text: 'Guwahati' }, { id: 'c', text: 'Imphal' }, { id: 'd', text: 'Dimapur' }], correct: 'a', explanation: 'Assam Rifles, the oldest paramilitary force, has its headquarters at Laitkor, Shillong.' },
          { id: 'q61', text: 'Which section of the IPC deals with defamation?', options: [{ id: 'a', text: 'Section 499' }, { id: 'b', text: 'Section 420' }, { id: 'c', text: 'Section 302' }, { id: 'd', text: 'Section 378' }], correct: 'a', explanation: 'Section 499 of the Indian Penal Code defines defamation.' },
          { id: 'q62', text: 'What is the full form of NDPS Act?', options: [{ id: 'a', text: 'Narcotic Drugs and Psychotropic Substances Act' }, { id: 'b', text: 'National Drugs Prevention Statute' }, { id: 'c', text: 'Narcotics Detection and Penal System' }, { id: 'd', text: 'Non-bailable Drugs Prevention Scheme' }], correct: 'a', explanation: 'The NDPS Act of 1985 controls and regulates operations relating to narcotic drugs.' },
          { id: 'q63', text: 'Which constitutional writ commands a public official to perform their official duties?', options: [{ id: 'a', text: 'Mandamus' }, { id: 'b', text: 'Habeas Corpus' }, { id: 'c', text: 'Certiorari' }, { id: 'd', text: 'Quo Warranto' }], correct: 'a', explanation: 'Mandamus translates to "We command", ordering an official to perform their duty.' },
          { id: 'q64', text: 'Under which schedule is the list of recognized languages in India found?', options: [{ id: 'a', text: 'Eighth Schedule' }, { id: 'b', text: 'Ninth Schedule' }, { id: 'c', text: 'Seventh Schedule' }, { id: 'd', text: 'Tenth Schedule' }], correct: 'a', explanation: 'The Eighth Schedule lists the 22 officially recognized languages of India.' },
          { id: 'q65', text: 'What does "Zero Hour" in Parliament mean?', options: [{ id: 'a', text: 'Time right after Question Hour to raise urgent matters without prior notice' }, { id: 'b', text: 'Time when budget is passed' }, { id: 'c', text: 'Time before session starts' }, { id: 'd', text: 'Midnight session' }], correct: 'a', explanation: 'Zero Hour is an Indian parliamentary innovation for raising matters of urgent public importance.' },
          { id: 'q66', text: 'Who determines the number of judges in a State High Court?', options: [{ id: 'a', text: 'The President of India' }, { id: 'b', text: 'Parliament' }, { id: 'c', text: 'Chief Justice of India' }, { id: 'd', text: 'Governor of the State' }], correct: 'a', explanation: 'The President determines the strength of a High Court from time to time depending on workload.' },
          { id: 'q67', text: 'What is the primary role of the CRPF?', options: [{ id: 'a', text: 'Assisting states in police operations to maintain law and order and counter-insurgency' }, { id: 'b', text: 'Guarding borders' }, { id: 'c', text: 'Protecting VIPs only' }, { id: 'd', text: 'Cyber security' }], correct: 'a', explanation: 'Central Reserve Police Force is the premier central police force for internal security.' },
          { id: 'q68', text: 'Section 124A of the IPC deals with:', options: [{ id: 'a', text: 'Sedition' }, { id: 'b', text: 'Murder' }, { id: 'c', text: 'Kidnapping' }, { id: 'd', text: 'Theft' }], correct: 'a', explanation: 'Section 124A criminalizes words or actions that bring hatred or contempt towards the government.' },
          { id: 'q69', text: 'What is a "Cognizable" offense?', options: [{ id: 'a', text: 'An offense where police can arrest without a warrant' }, { id: 'b', text: 'A minor traffic violation' }, { id: 'c', text: 'An offense requiring court summons first' }, { id: 'd', text: 'A civil dispute' }], correct: 'a', explanation: 'Serious crimes like murder and robbery are cognizable, allowing immediate police arrest.' },
          { id: 'q70', text: 'What is the full form of NSG?', options: [{ id: 'a', text: 'National Security Guard' }, { id: 'b', text: 'National Service Group' }, { id: 'c', text: 'Naval Security Guard' }, { id: 'd', text: 'National Strike Group' }], correct: 'a', explanation: 'NSG (Black Cats) is a federal contingency world-class zero-error force for counter-terrorism.' },
          { id: 'q71', text: 'Which authority conducts the election to the offices of the President and Vice-President of India?', options: [{ id: 'a', text: 'Election Commission of India' }, { id: 'b', text: 'Parliament' }, { id: 'c', text: 'Supreme Court' }, { id: 'd', text: 'State Election Commission' }], correct: 'a', explanation: 'Article 324 vests this power in the Election Commission of India.' },
          { id: 'q72', text: 'The Right to Information (RTI) Act came into full force in which year?', options: [{ id: 'a', text: '2005' }, { id: 'b', text: '2000' }, { id: 'c', text: '2010' }, { id: 'd', text: '2015' }], correct: 'a', explanation: 'The RTI Act was passed and came into practical effect in October 2005.' },
          { id: 'q73', text: 'What is the maximum strength of the Lok Sabha?', options: [{ id: 'a', text: '550' }, { id: 'b', text: '545' }, { id: 'c', text: '500' }, { id: 'd', text: '552' }], correct: 'a', explanation: 'Post 104th amendment (removing Anglo-Indian seats), max strength is 550.' },
          { id: 'q74', text: 'The term "Habeas Corpus" literally means:', options: [{ id: 'a', text: 'You may have the body' }, { id: 'b', text: 'We command' }, { id: 'c', text: 'By what authority' }, { id: 'd', text: 'To be certified' }], correct: 'a', explanation: 'It is a writ requiring a person under arrest to be brought before a judge.' },
          { id: 'q75', text: 'In police terminology, what does "Malkhana" refer to?', options: [{ id: 'a', text: 'The property room where seized evidence is stored' }, { id: 'b', text: 'The interrogation room' }, { id: 'c', text: 'The officers mess' }, { id: 'd', text: 'The jail cell' }], correct: 'a', explanation: 'Malkhana is the strong room in a police station for storing seized arms, drugs, and case properties.' },
          { id: 'q76', text: 'Who administers the oath to the Prime Minister of India?', options: [{ id: 'a', text: 'President' }, { id: 'b', text: 'Chief Justice of India' }, { id: 'c', text: 'Speaker of Lok Sabha' }, { id: 'd', text: 'Vice President' }], correct: 'a', explanation: 'The President of India administers the oaths of office and secrecy to the PM.' },
          { id: 'q77', text: 'Under which article does the President have the power to grant pardons?', options: [{ id: 'a', text: 'Article 72' }, { id: 'b', text: 'Article 61' }, { id: 'c', text: 'Article 123' }, { id: 'd', text: 'Article 143' }], correct: 'a', explanation: 'Article 72 grants the President the pardoning power against criminal sentences.' },
          { id: 'q78', text: 'What is the rank of an officer who wears three stars on their shoulder epaulettes?', options: [{ id: 'a', text: 'Inspector' }, { id: 'b', text: 'Sub-Inspector' }, { id: 'c', text: 'DSP' }, { id: 'd', text: 'Constable' }], correct: 'a', explanation: 'A Police Inspector wears three stars with a red and blue ribbon.' },
          { id: 'q79', text: 'What does the acronym VDP stand for in rural Assam policing?', options: [{ id: 'a', text: 'Village Defence Party' }, { id: 'b', text: 'Village Development Police' }, { id: 'c', text: 'Voluntary Duty Personnel' }, { id: 'd', text: 'Village Disaster Patrol' }], correct: 'a', explanation: 'Village Defence Parties assist local police in rural security and night patrols.' },
          { id: 'q80', text: 'Which section of CrPC deals with the procedure when police officer deputes subordinate to arrest without warrant?', options: [{ id: 'a', text: 'Section 55' }, { id: 'b', text: 'Section 41' }, { id: 'c', text: 'Section 151' }, { id: 'd', text: 'Section 144' }], correct: 'a', explanation: 'Section 55 allows an officer in charge to depute a subordinate to arrest via a written order.' },
          { id: 'q81', text: 'How long can a person be held in police custody without being presented to a Magistrate?', options: [{ id: 'a', text: '24 Hours' }, { id: 'b', text: '48 Hours' }, { id: 'c', text: '12 Hours' }, { id: 'd', text: '72 Hours' }], correct: 'a', explanation: 'Article 22 mandates production before a magistrate within 24 hours (excluding travel time).' },
          { id: 'q82', text: 'The "Preamble" of the Indian Constitution was amended by which amendment?', options: [{ id: 'a', text: '42nd Amendment' }, { id: 'b', text: '44th Amendment' }, { id: 'c', text: '73rd Amendment' }, { id: 'd', text: '1st Amendment' }], correct: 'a', explanation: 'The 42nd Amendment (1976) added Socialist, Secular, and Integrity to the Preamble.' },
          { id: 'q83', text: 'Which Article is known as the "Soul of the Constitution"?', options: [{ id: 'a', text: 'Article 32' }, { id: 'b', text: 'Article 14' }, { id: 'c', text: 'Article 19' }, { id: 'd', text: 'Article 21' }], correct: 'a', explanation: 'Dr. B.R. Ambedkar called Article 32 (Constitutional Remedies) the heart and soul of the Constitution.' },
          { id: 'q84', text: 'The Armed Forces (Special Powers) Act (AFSPA) grants special powers primarily to:', options: [{ id: 'a', text: 'Military and Paramilitary forces in "disturbed areas"' }, { id: 'b', text: 'State Traffic Police' }, { id: 'c', text: 'CBI investigators' }, { id: 'd', text: 'Election Commission' }], correct: 'a', explanation: 'AFSPA empowers armed forces to maintain order in legally declared disturbed areas.' },
          { id: 'q85', text: 'If a police officer refuses to file an FIR for a cognizable offense, the victim can appeal to:', options: [{ id: 'a', text: 'Superintendent of Police (SP)' }, { id: 'b', text: 'Traffic Inspector' }, { id: 'c', text: 'District Collector' }, { id: 'd', text: 'Sub-Inspector' }], correct: 'a', explanation: 'Under Sec 154(3) CrPC, a complainant can send the substance of the info to the SP.' },
          { id: 'q86', text: 'Section 498A of the IPC deals with:', options: [{ id: 'a', text: 'Cruelty by husband or relatives of husband' }, { id: 'b', text: 'Dowry Death' }, { id: 'c', text: 'Theft' }, { id: 'd', text: 'Cyber Fraud' }], correct: 'a', explanation: 'Section 498A was introduced to combat domestic violence and cruelty against married women.' },
          { id: 'q87', text: 'What is the full form of POSCO Act?', options: [{ id: 'a', text: 'Protection of Children from Sexual Offences' }, { id: 'b', text: 'Prevention of Cyber Scams and Offenses' }, { id: 'c', text: 'Public Order and Security Control Organization' }, { id: 'd', text: 'Police Organization for Social Crime Omission' }], correct: 'a', explanation: 'The POCSO Act 2012 provides robust legal framework to protect children from abuse.' },
          { id: 'q88', text: 'Who issues a Search Warrant?', options: [{ id: 'a', text: 'A Court/Magistrate' }, { id: 'b', text: 'Head Constable' }, { id: 'c', text: 'Investigating Officer' }, { id: 'd', text: 'Complainant' }], correct: 'a', explanation: 'A search warrant is a legal document authorized by a judge or magistrate.' },
          { id: 'q89', text: 'Which schedule of the Indian Constitution deals with Anti-Defection Law?', options: [{ id: 'a', text: 'Tenth Schedule' }, { id: 'b', text: 'Ninth Schedule' }, { id: 'c', text: 'Eighth Schedule' }, { id: 'd', text: 'Eleventh Schedule' }], correct: 'a', explanation: 'The 10th Schedule, added in 1985, lays down the process to disqualify defecting legislators.' },
          { id: 'q90', text: 'Who is the Supreme Commander of the Indian Armed Forces?', options: [{ id: 'a', text: 'President of India' }, { id: 'b', text: 'Prime Minister' }, { id: 'c', text: 'Chief of Defence Staff' }, { id: 'd', text: 'Defence Minister' }], correct: 'a', explanation: 'Article 53(2) vests the supreme command of the defence forces in the President.' },
          { id: 'q91', text: 'What is the standard emergency number for Police in India?', options: [{ id: 'a', text: '100 (or 112)' }, { id: 'b', text: '101' }, { id: 'c', text: '108' }, { id: 'd', text: '104' }], correct: 'a', explanation: '100 is the traditional police helpline, now being integrated into the 112 ERSS system.' },
          { id: 'q92', text: 'Which chemical is primarily used as "Tear Gas" by riot police for crowd control?', options: [{ id: 'a', text: 'CS Gas (Chlorobenzylidenemalononitrile)' }, { id: 'b', text: 'Nitrous Oxide' }, { id: 'c', text: 'Carbon Monoxide' }, { id: 'd', text: 'Hydrogen Sulfide' }], correct: 'a', explanation: 'CS gas is the most common non-lethal tear gas used for dispersing violent crowds.' },
          { id: 'q93', text: 'A "Charge Sheet" is filed in court by the police under which section of CrPC?', options: [{ id: 'a', text: 'Section 173' }, { id: 'b', text: 'Section 154' }, { id: 'c', text: 'Section 164' }, { id: 'd', text: 'Section 144' }], correct: 'a', explanation: 'The final police report (charge sheet) upon completion of investigation is filed under Sec 173.' },
          { id: 'q94', text: 'Which agency is responsible for protecting India\'s VIPs/VVIPs (like the PM)?', options: [{ id: 'a', text: 'Special Protection Group (SPG) / SPG Act' }, { id: 'b', text: 'BSF' }, { id: 'c', text: 'State Police' }, { id: 'd', text: 'CBI' }], correct: 'a', explanation: 'The SPG is a specialized force created specifically for the proximate security of the PM.' },
          { id: 'q95', text: 'Cyber crime complaints in India can be registered nationally through which portal?', options: [{ id: 'a', text: 'cybercrime.gov.in' }, { id: 'b', text: 'police.gov.in' }, { id: 'c', text: 'cbi.nic.in' }, { id: 'd', text: 'digitalindia.gov.in' }], correct: 'a', explanation: 'The National Cyber Crime Reporting Portal facilitates online complaints for cyber crimes.' },
          { id: 'q96', text: 'Who heads the State Disaster Management Authority?', options: [{ id: 'a', text: 'Chief Minister' }, { id: 'b', text: 'Governor' }, { id: 'c', text: 'DGP' }, { id: 'd', text: 'Chief Secretary' }], correct: 'a', explanation: 'The SDMA is statutorily chaired by the Chief Minister of the State.' },
          { id: 'q97', text: 'Under IPC Section 392, what crime is punishable?', options: [{ id: 'a', text: 'Robbery' }, { id: 'b', text: 'Theft' }, { id: 'c', text: 'Murder' }, { id: 'd', text: 'Extortion' }], correct: 'a', explanation: 'Section 392 of the IPC prescribes punishment for the offense of robbery.' },
          { id: 'q98', text: 'What is the full form of AFIS used in forensic investigation?', options: [{ id: 'a', text: 'Automated Fingerprint Identification System' }, { id: 'b', text: 'Advanced Forensic Investigation Software' }, { id: 'c', text: 'Analytical Fingerprint Imagery System' }, { id: 'd', text: 'Automated Facial Identification System' }], correct: 'a', explanation: 'AFIS is a biometric database used globally to store and cross-reference fingerprints.' },
          { id: 'q99', text: 'Which unit is the elite anti-Naxal and anti-terror force of the Andhra Pradesh/Telangana police, acting as a model for other states?', options: [{ id: 'a', text: 'Greyhounds' }, { id: 'b', text: 'Cobras' }, { id: 'c', text: 'Black Cats' }, { id: 'd', text: 'Garud' }], correct: 'a', explanation: 'The Greyhounds are a legendary state police special forces unit specializing in jungle warfare.' },
          { id: 'q100', text: 'In forensic ballistics, what does GSR stand for?', options: [{ id: 'a', text: 'Gunshot Residue' }, { id: 'b', text: 'Gun Sight Range' }, { id: 'c', text: 'General Security Rifle' }, { id: 'd', text: 'Gunpowder Smoke Reaction' }], correct: 'a', explanation: 'GSR is the residue deposited on hands/clothes after a firearm is discharged, crucial in evidence.' }
        ]
      },
      apsc: {
        id: 'apsc',
        title: 'APSC Prelims Standard',
        icon: 'award',
        color: 'purple',
        questions: [
          { id: 'q1', text: 'When was the Assam Public Service Commission (APSC) formally established?', options: [{ id: 'a', text: '1st April 1937' }, { id: 'b', text: '15th August 1947' }, { id: 'c', text: '26th January 1950' }, { id: 'd', text: '1st November 1956' }], correct: 'a', explanation: 'APSC was established on April 1, 1937 under the provisions of the Government of India Act, 1935.' },
