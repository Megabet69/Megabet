            <p class="text-xs mt-1">Start the conversation.</p>
          </div>`;
      }

      return state.chatMessages.map(m => {
        const mine = m.senderId === getClientId();
        return `
          <div class="flex ${mine ? 'justify-end' : 'justify-start'}">
            <div class="max-w-[80%] px-4 py-2.5 rounded-2xl ${
              mine
                ? 'bg-blue-600 text-white rounded-br-md'
                : 'bg-white text-gray-800 border border-gray-200 rounded-bl-md'
            }">
              <p class="text-sm whitespace-pre-wrap break-words">${escapeHTML(m.text)}</p>
              <p class="text-[10px] mt-1 ${mine ? 'text-blue-100' : 'text-gray-400'}">
                ${formatChatTime(m.createdAt)}
              </p>
            </div>
          </div>`;
      }).join('');
    }

    function formatChatTime(timestamp) {
      const d = new Date(timestamp || Date.now());
      return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    }

    async function openChatWith(encodedId) {
      const otherId = decodeURIComponent(encodedId);
      if (!otherId || otherId === getClientId()) return;

      cleanupChatListeners();

      try {
        const snap = await firebaseDB.ref("users/" + otherId + "/profile").once("value");
        const profile = snap.val() || {};

        state.chatUser = {
          id: otherId,
          name: profile.name || "Student",
          place: profile.place || "Place not set",
          avatar: profile.avatar || "😀"
        };

        state.chatMessages = [];
        state.currentScreen = "chat";
        render();

        await markChatRead(otherId);
        startChatListener(otherId);
      } catch (error) {
        console.error("Could not open chat:", error);
        showToast("Could not open this chat.", "error");
      }
    }

    function startChatListener(otherId) {
      const ref = chatRootWith(otherId).child("messages");

      state.chatListener = ref.on("value", snapshot => {
        const data = snapshot.val() || {};

        state.chatMessages = Object.entries(data)
          .map(([id, m]) => ({id, ...m}))
          .sort((a,b) => Number(a.createdAt || 0) - Number(b.createdAt || 0));

        if (state.currentScreen === "chat") {
          markChatRead(otherId);
        }

        if (state.currentScreen === "chat") {
          const box = document.getElementById("chat-messages");
          if (box) {
            box.innerHTML = renderChatMessages();
            box.scrollTop = box.scrollHeight;
            lucide.createIcons();
          }
        }
      });
    }

    function cleanupChatListeners() {
      if (state.chatListener && state.chatUser?.id) {
        chatRootWith(state.chatUser.id).child("messages").off("value", state.chatListener);
      }
      state.chatListener = null;
      state.chatUser = null;
      state.chatMessages = [];
    }

    async function sendChatMessage(event) {
      event.preventDefault();

      const input = document.getElementById("chat-input");
      const text = (input?.value || "").trim();
      const otherId = state.chatUser?.id;

      if (!text || !otherId) return;

      const messageRef = chatRootWith(otherId).child("messages").push();

      const message = {
        senderId: getClientId(),
        receiverId: otherId,
        text,
        createdAt: firebase.database.ServerValue.TIMESTAMP
      };

      try {
        await messageRef.set(message);

        // Conversation metadata helps build notification/chat lists later.
        await chatRootWith(otherId).child("meta").update({
          lastMessage: text,
          lastMessageAt: firebase.database.ServerValue.TIMESTAMP,
          lastSenderId: getClientId(),
          userA: getClientId(),
          userB: otherId
        });

        if (input) {
          input.value = "";
          input.focus();
        }
      } catch (error) {
        console.error("Message send failed:", error);
        showToast("Message could not be sent.", "error");
      }
    }

    function render() {
      updateHeader();
      let content = '';

      if (state.currentScreen === 'loading') {
        content = `<div class="flex flex-col items-center justify-center mt-32"><div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div><p class="mt-4 text-gray-600 font-medium">Loading...</p></div>`;
      } else if (state.currentScreen === 'welcome') {
        content = `<div class="fade-in max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl border border-gray-100 mt-10"><div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mb-6 shadow-inner"><i data-lucide="book-open" class="w-8 h-8"></i></div><h2 class="text-3xl font-bold text-gray-900 mb-2">Welcome!</h2><p class="text-gray-600 mb-8">Please enter your details to begin your preparation. Your profile and progress will be saved securely to Firebase.</p><div class="space-y-4"><div><label class="block text-sm font-semibold text-gray-700 mb-1">Full Name</label><div class="relative"><i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5"></i><input type="text" id="input-name" oninput="validateProfileForm()" onchange="validateProfileForm()" class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Enter your name" /></div></div><div><label class="block text-sm font-semibold text-gray-700 mb-1">District / Place</label><div class="relative"><i data-lucide="map-pin" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5"></i><input type="text" id="input-place" oninput="validateProfileForm()" onchange="validateProfileForm()" class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Enter your place" /></div></div><button id="btn-save-profile" onclick="handleProfileSave()" disabled class="btn btn-primary w-full mt-4 py-3 text-lg">Start Preparation <i data-lucide="chevron-right" class="w-5 h-5"></i></button></div></div>`;
      } else if (state.currentScreen === 'firebase-error') {
        content = `
          <div class="max-w-md mx-auto mt-16 bg-white rounded-2xl shadow-sm border border-red-200 p-8 text-center fade-in">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-red-50 text-red-600 flex items-center justify-center mb-5">
              <i data-lucide="wifi-off" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-gray-900 mb-2">Unable to connect</h2>
            <p class="text-gray-500 mb-6">Your account and progress are stored in Firebase. Please check your internet connection and try again.</p>
            <button onclick="initApp()" class="btn btn-primary w-full">
              <i data-lucide="refresh-cw" class="w-4 h-4"></i> Try Again
            </button>
          </div>`;
      } else if (state.currentScreen === 'dashboard') {
        content = renderDashboard();

      } else if (state.currentScreen === 'profile') {
        const stats = getProfileStats();
        const performances = getCategoryPerformance();
        const attemptedCats = performances.filter(p => p.attempted > 0);
        const strongest = [...attemptedCats].sort((a,b) => b.accuracy - a.accuracy).slice(0,3);
        const weakest = [...attemptedCats].sort((a,b) => a.accuracy - b.accuracy).slice(0,3);

        content = `
          <div class="max-w-6xl mx-auto fade-in">

            <div class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden mb-6">
              <div class="bg-gradient-to-r from-blue-600 to-indigo-600 h-32"></div>
              <div class="px-6 sm:px-8 pb-8">
                <div class="flex flex-col sm:flex-row sm:items-end gap-4 -mt-12">
                  <div class="w-24 h-24 rounded-2xl bg-white shadow-lg flex items-center justify-center text-5xl border-4 border-white">
                    ${getProfileAvatar()}
                  </div>
                  <div class="flex-1">
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900">${escapeHTML(state.profile?.name || 'Student')}</h1>
                    <p class="text-gray-500 flex items-center gap-2 mt-1">
                      <i data-lucide="map-pin" class="w-4 h-4"></i>
                      ${escapeHTML(state.profile?.place || 'Place not set')}
                    </p>
                  </div>
                  <div class="flex gap-2">
                    <button onclick="openProfileEdit()" class="btn btn-primary">
                      <i data-lucide="pencil" class="w-4 h-4"></i> Edit Profile
                    </button>
                    <button onclick="showLeaderboard()" class="btn btn-outline relative">
                      <i data-lucide="trophy" class="w-4 h-4"></i> Leaderboard
                      <span id="leaderboard-msg-dot" class="hidden absolute -top-1 -right-1 w-3 h-3 rounded-full bg-red-500 border-2 border-white"></span>
                    </button>
                    <button onclick="goDashboard()" class="btn btn-outline">
                      <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 mb-6">
              <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div>
                  <p class="text-sm text-gray-500 font-medium">Overall Performance</p>
                  <div class="flex items-center gap-3 mt-2">
                    <span class="text-2xl font-extrabold text-gray-900">${stats.level}</span>
                    <span class="px-3 py-1 rounded-full text-xs font-bold ${stats.levelClass}">
                      ${stats.score.toFixed(1)}% Score
                    </span>
                  </div>
                </div>
                <div class="text-left sm:text-right">
                  <p class="text-xs uppercase tracking-wider text-gray-400">Accuracy</p>
                  <p class="text-3xl font-extrabold text-blue-600">${stats.accuracy.toFixed(1)}%</p>
                </div>
              </div>
              <div class="mt-5 h-3 bg-gray-100 rounded-full overflow-hidden">
                <div class="h-full rounded-full bg-blue-600" style="width:${Math.min(100,Math.max(0,stats.accuracy))}%"></div>
              </div>
            </div>

            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
              ${profileStatCard('file-check-2','Tests Completed',stats.totalTests,'blue')}
              ${profileStatCard('target','Questions Attempted',stats.attempted,'indigo')}
              ${profileStatCard('check-circle-2','Correct',stats.correct,'green')}
              ${profileStatCard('x-circle','Wrong',stats.wrong,'red')}
            </div>

            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
              ${profileStatCard('skip-forward','Skipped',stats.skipped,'amber')}
              ${profileStatCard('clock-3','Total Time',formatSeconds(stats.totalTime),'purple')}
              ${profileStatCard('timer','Avg / Question',formatSeconds(stats.avgTime),'cyan')}
              ${profileStatCard('award','Best Score',getBestScore().toFixed(1) + '%','orange')}
            </div>

            <div class="grid lg:grid-cols-2 gap-6 mb-6">

              <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6">
                <div class="flex items-center justify-between mb-5">
                  <div>
                    <h2 class="text-lg font-bold text-gray-900">Strong Areas</h2>
                    <p class="text-sm text-gray-500">Your best performing categories</p>
                  </div>
                  <i data-lucide="trending-up" class="text-green-500"></i>
                </div>
                ${strongest.length ? strongest.map(p => `
                  <div class="mb-4 last:mb-0">
                    <div class="flex justify-between text-sm mb-1">
                      <span class="font-semibold text-gray-700">${escapeHTML(p.category.title)}</span>
                      <span class="font-bold text-green-600">${p.accuracy.toFixed(1)}%</span>
                    </div>
                    <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
                      <div class="h-full bg-green-500 rounded-full" style="width:${Math.min(100,p.accuracy)}%"></div>
                    </div>
                  </div>
                `).join('') : emptyProfileState('bar-chart-3','Complete a test to see strong areas.')}
              </div>

              <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6">
                <div class="flex items-center justify-between mb-5">
                  <div>
                    <h2 class="text-lg font-bold text-gray-900">Weak Areas</h2>
                    <p class="text-sm text-gray-500">Categories that need more practice</p>
                  </div>
                  <i data-lucide="trending-down" class="text-red-500"></i>
                </div>
                ${weakest.length ? weakest.map(p => `
                  <div class="mb-4 last:mb-0">
                    <div class="flex justify-between text-sm mb-1">
                      <span class="font-semibold text-gray-700">${escapeHTML(p.category.title)}</span>
                      <span class="font-bold ${p.accuracy < 40 ? 'text-red-600' : 'text-yellow-600'}">${p.accuracy.toFixed(1)}%</span>
                    </div>
                    <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
                      <div class="h-full ${p.accuracy < 40 ? 'bg-red-500' : 'bg-yellow-500'} rounded-full" style="width:${Math.min(100,p.accuracy)}%"></div>
                    </div>
                  </div>
                `).join('') : emptyProfileState('brain','Complete a test to identify weak areas.')}
              </div>

            </div>

            <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 mb-6">
              <div class="mb-5">
                <h2 class="text-lg font-bold text-gray-900">Category Performance</h2>
                <p class="text-sm text-gray-500">Detailed performance by subject</p>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-sm">
                  <thead>
                    <tr class="text-left border-b border-gray-100">
                      <th class="pb-3 pr-4 text-gray-500 font-semibold">Category</th>
                      <th class="pb-3 px-4 text-gray-500 font-semibold">Attempted</th>
                      <th class="pb-3 px-4 text-gray-500 font-semibold">Correct</th>
                      <th class="pb-3 px-4 text-gray-500 font-semibold">Wrong</th>
                      <th class="pb-3 px-4 text-gray-500 font-semibold">Accuracy</th>
                      <th class="pb-3 pl-4 text-gray-500 font-semibold">Time</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${performances.map(p => `
                      <tr class="border-b border-gray-50">
                        <td class="py-4 pr-4 font-semibold text-gray-800">${escapeHTML(p.category.title)}</td>
                        <td class="py-4 px-4">${p.attempted}</td>
                        <td class="py-4 px-4 text-green-600 font-semibold">${p.correct}</td>
                        <td class="py-4 px-4 text-red-600 font-semibold">${p.wrong}</td>
                        <td class="py-4 px-4">
                          <span class="font-bold ${p.accuracy >= 60 ? 'text-green-600' : p.accuracy >= 40 ? 'text-yellow-600' : 'text-red-600'}">
                            ${p.accuracy.toFixed(1)}%
                          </span>
                        </td>
                        <td class="py-4 pl-4 text-gray-600">${formatSeconds(p.time)}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <div class="grid md:grid-cols-3 gap-4 mb-8">
              <div class="bg-green-50 border border-green-100 rounded-2xl p-5">
                <div class="text-green-600 mb-3"><i data-lucide="check-circle-2"></i></div>
                <p class="text-sm text-green-700 font-medium">Correct Answers</p>
                <p class="text-2xl font-extrabold text-green-800 mt-1">${stats.correct}</p>
              </div>
              <div class="bg-red-50 border border-red-100 rounded-2xl p-5">
                <div class="text-red-600 mb-3"><i data-lucide="x-circle"></i></div>
                <p class="text-sm text-red-700 font-medium">Wrong Answers</p>
                <p class="text-2xl font-extrabold text-red-800 mt-1">${stats.wrong}</p>
              </div>
              <div class="bg-yellow-50 border border-yellow-100 rounded-2xl p-5">
                <div class="text-yellow-600 mb-3"><i data-lucide="skip-forward"></i></div>
                <p class="text-sm text-yellow-700 font-medium">Skipped</p>
                <p class="text-2xl font-extrabold text-yellow-800 mt-1">${stats.skipped}</p>
              </div>
            </div>

          </div>`;

      } else if (state.currentScreen === 'leaderboard') {
        content = `
          <div class="max-w-5xl mx-auto fade-in">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-5 mobile-safe">
              <div>
                <h1 class="text-2xl font-extrabold text-gray-900">Leaderboard</h1>
                <p class="text-sm text-gray-500">Ranked by overall accuracy</p>
              </div>
              <div class="flex gap-2 mobile-toolbar">
                <button onclick="goProfile()" class="btn btn-outline">
                  <i data-lucide="arrow-left" class="w-4 h-4"></i> Profile
                </button>
                <button onclick="loadLeaderboard()" class="btn btn-primary">
                  <i data-lucide="refresh-cw" class="w-4 h-4"></i> Refresh
                </button>
              </div>
            </div>

            <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
              <div class="p-4 sm:p-5 border-b border-gray-100 flex items-center justify-between">
                <div>
                  <p class="font-bold text-gray-900">${state.leaderboard.length} registered users</p>
                  <p class="text-xs text-gray-500 mt-1">Name • Place • Accuracy • Rank</p>
                </div>
                <span class="text-xs font-semibold px-3 py-1 rounded-full bg-blue-50 text-blue-700">
                  Live
                </span>
              </div>

              <div class="divide-y divide-gray-100">
                ${state.leaderboard.length ? state.leaderboard.map((u, i) => `
                  <div class="leaderboard-row p-4 sm:p-5 flex items-center gap-3 sm:gap-4 hover:bg-gray-50 mobile-safe">
                    <div class="leaderboard-rank w-9 h-9 shrink-0 rounded-xl flex items-center justify-center font-extrabold
                      ${i===0 ? 'bg-yellow-100 text-yellow-700' : i===1 ? 'bg-gray-100 text-gray-700' : i===2 ? 'bg-orange-100 text-orange-700' : 'bg-blue-50 text-blue-700'}">
                      ${i + 1}
                    </div>
                    <div class="leaderboard-avatar w-11 h-11 shrink-0 rounded-xl bg-blue-50 flex items-center justify-center text-2xl">
                      ${escapeHTML(u.avatar || "😀")}
                    </div>
                    <div class="min-w-0 flex-1 mobile-safe">
                      <p class="leaderboard-name font-bold text-gray-900 truncate">
                        ${escapeHTML(u.name || "Student")}
                        ${u.id === getClientId() ? '<span class="ml-2 text-xs text-blue-600">(You)</span>' : ''}
                      </p>
                      <p class="text-xs text-gray-500 truncate flex items-center gap-1">
                        <i data-lucide="map-pin" class="w-3 h-3"></i>
                        ${escapeHTML(u.place || "Place not set")}
                      </p>
                    </div>
                    <div class="leaderboard-accuracy text-right mr-1 sm:mr-3 shrink-0">
                      <p class="font-extrabold ${u.accuracy >= 60 ? 'text-green-600' : u.accuracy >= 40 ? 'text-yellow-600' : 'text-red-600'}">
                        ${u.accuracy.toFixed(1)}%
                      </p>
                      <p class="text-[11px] text-gray-400">${u.attempted} attempted</p>
                    </div>
                    ${u.id !== getClientId() ? `
                      <button onclick="openChatWith('${encodeURIComponent(u.id)}')" class="leaderboard-message relative w-10 h-10 rounded-xl bg-blue-50 text-blue-600 hover:bg-blue-100 flex items-center justify-center" title="Message">
                        <i data-lucide="message-circle" class="w-5 h-5"></i>
                        ${(state.unreadChats && state.unreadChats[u.id]) ? '<span class="message-unread-dot absolute -top-1 -right-1 w-3 h-3 rounded-full bg-red-500 border-2 border-white"></span>' : ''}
                      </button>
                    ` : ''}
                  </div>
                `).join('') : `
                  <div class="py-16 text-center text-gray-400">
                    <i data-lucide="users" class="w-10 h-10 mx-auto mb-3"></i>
                    <p class="font-semibold">No registered users yet.</p>
                  </div>
                `}
              </div>
            </div>
          </div>`;

      } else if (state.currentScreen === 'chat') {
        const u = state.chatUser || {};
        content = `
          <div class="chat-shell max-w-3xl mx-auto h-[calc(100vh-150px)] min-h-[500px] flex flex-col bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden fade-in">
            <div class="px-4 py-3 border-b border-gray-100 flex items-center gap-3">
              <button onclick="showLeaderboard()" class="w-9 h-9 rounded-xl bg-gray-100 flex items-center justify-center">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
              </button>
              <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center text-2xl">${escapeHTML(u.avatar || "😀")}</div>
              <div class="min-w-0 flex-1">
                <p class="font-bold text-gray-900 truncate">${escapeHTML(u.name || "Student")}</p>
                <p class="text-xs text-gray-500 truncate">${escapeHTML(u.place || "")}</p>
              </div>
            </div>

            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50">
              ${renderChatMessages()}
            </div>

            <form onsubmit="sendChatMessage(event)" class="chat-composer p-3 border-t border-gray-100 bg-white flex gap-2">
              <input id="chat-input" type="text" maxlength="500" autocomplete="off"
                class="flex-1 px-4 py-3 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Write a message..." />
              <button class="btn btn-primary px-4" type="submit">
                <i data-lucide="send" class="w-5 h-5"></i>
                <span class="chat-send-text hidden sm:inline">Send</span>
              </button>
            </form>
          </div>`;
      } else if (state.currentScreen === 'quiz') {
        content = renderQuiz();
      } else if (state.currentScreen === 'review') {
        content = renderResults();
      }

      rootEl.innerHTML = content;
      lucide.createIcons();
      updateMessageDots();
    }


    function showToast(message, type = "info") {
      let toast = document.getElementById("app-toast");
      if (!toast) {
        toast = document.createElement("div");
        toast.id = "app-toast";
        toast.className = "fixed bottom-5 right-5 z-[200] max-w-sm px-4 py-3 rounded-xl shadow-xl text-sm font-semibold";
        document.body.appendChild(toast);
      }

      toast.className =
        "fixed bottom-5 right-5 z-[200] max-w-sm px-4 py-3 rounded-xl shadow-xl text-sm font-semibold " +
        (type === "error"
          ? "bg-red-600 text-white"
          : type === "success"
            ? "bg-green-600 text-white"
            : "bg-gray-900 text-white");

      toast.textContent = message;

      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => toast.remove(), 3500);
    }

    async function initApp() {
      // Open the app immediately. Firebase must not block the interface.
      state.currentScreen = state.profile ? "dashboard" : "welcome";
      render();
      setFirebaseStatus("offline");

      try {
        await loadFirebaseData();
        startUnreadMessageMonitor();
        state.currentScreen = state.profile ? "dashboard" : "welcome";
        render();
      } catch (error) {
        console.error("Initial Firebase load failed:", error);
        setFirebaseStatus("offline");
        scheduleFirebaseRetry();

        // The app remains usable instead of staying on Loading.
        state.currentScreen = state.profile ? "dashboard" : "welcome";
        render();
      }
    }

    // Keep the question timer display accurate without re-rendering the question.
    setInterval(() => {
      if (state.currentScreen !== 'quiz') return;
      const el = document.getElementById('question-time');
      if (el) el.textContent = formatSeconds(getLiveQuestionSeconds());
    }, 1000);

    initApp();
  </script>

    <div id="developer-credit-sanu"
         class="text-center py-5 text-xs text-gray-400 font-medium">
      Developed by <span class="text-gray-600 font-semibold">Sanu</span>
    </div>

</body>
